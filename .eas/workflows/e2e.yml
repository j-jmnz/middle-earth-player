# Runs the Maestro flows on an Android e2e-test build. Manual only: start it with `eas workflow:run .eas/workflows/e2e.yml`, which needs
# a login to the Expo account that owns the project. No push or pull request starts it, so a contributor's change cannot spend the
# project's EAS build minutes.
name: e2e
on:
  workflow_dispatch: {}
jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: e2e-test
  maestro:
    needs: [build_android]
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: .maestro
