# The Discord issue bot's Worker (docs/discord-issues.md). Deploy from this folder: npx wrangler deploy.
# Secrets (wrangler secret put): DISCORD_PUBLIC_KEY, DISCORD_APPLICATION_ID, DISCORD_BOT_TOKEN, GITHUB_TOKEN,
# GITHUB_WEBHOOK_SECRET, GUILD_ID (the one server the bot answers; unset, it answers no command); optional:
# RELEASES_CHANNEL_ID, RELEASES_ROLE_ID.
# GITHUB_ISSUE_AUTHOR is the login of the account that owns GITHUB_TOKEN: the bot follows only the issues that account
# wrote. Unset, it posts no issue update.
name = "middle-earth-issues"
main = "worker.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
GITHUB_REPO = "j-jmnz/middle-earth-player"
GITHUB_ISSUE_AUTHOR = "j-jmnz"

[observability]
enabled = true
