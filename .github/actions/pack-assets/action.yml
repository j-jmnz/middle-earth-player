name: Pack the app's assets
description: Installs the dependencies and packs the catalog, the booklets and every card picture into assets/, as each native build needs (docs/releasing.md, Jobs).

runs:
  using: composite
  steps:
    - uses: ./.github/actions/install
    # pdftoppm renders the campaign, boon and burden cards from FFG's PDFs (scripts/build/pack-scans.ts).
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
    - if: runner.os == 'macOS'
      shell: bash
      run: brew install poppler
    # pack-scans keeps a packed picture while its pin is unchanged, so an earlier run's assets/scans saves the downloads.
    # The newest cache under the prefix is restored when this key has none, a partial one from a failed run included.
    - id: key
      shell: bash
      run: echo "scans=scans-${{ runner.os }}-${{ hashFiles('data/sources.json', 'scripts/build/pack-scans.ts', 'src/screens/art/crop.ts') }}" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: assets/scans
        key: ${{ steps.key.outputs.scans }}
        restore-keys: scans-${{ runner.os }}-
    - id: pack
      name: Catalog, booklets and pictures
      shell: bash
      run: pnpm assets --quiet
    # Saved after a failure too, under a key of its own: pack-scans stamps what it finished, so a rerun fetches only the rest.
    - if: always() && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: assets/scans
        key: ${{ steps.pack.outcome == 'success' && steps.key.outputs.scans || format('scans-{0}-partial-{1}-{2}', runner.os, github.run_id, github.run_attempt) }}
