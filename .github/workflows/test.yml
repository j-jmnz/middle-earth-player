name: test

on:
  push:
  pull_request:
  # The release workflow runs the same checks on the commit it releases.
  workflow_call:

# Read-only token: pull requests from forks run with no write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The pull request title becomes the squash commit's subject (.claude/rules/commit-standards.md, Squash).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: pnpm commit:check "$TITLE"
      - name: Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm commit:check --range "$BASE..$HEAD"
