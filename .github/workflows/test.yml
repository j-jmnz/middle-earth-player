name: test

on:
  push:
  pull_request:
  # The release workflow runs the same checks on the commit it releases.
  workflow_call:

# Read-only token: pull requests from forks run with no write access. Actions are pinned to a commit, not a
# movable tag; Dependabot (.github/dependabot.yml) proposes the updates.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The pull request title becomes the squash commit's subject (.claude/rules/commit-standards.md, Squash).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: pnpm commit:check "$TITLE"
      - name: Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm commit:check --range "$BASE..$HEAD"
