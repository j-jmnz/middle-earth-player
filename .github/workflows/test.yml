name: test

on:
  # A pull request runs once, on its merge with main; push runs only on the branches that release, so a push to a
  # pull request's branch does not start a second, identical run.
  push:
    branches: [main, "release/**"]
  pull_request:
  # The release workflow runs the same checks on the commit it releases.
  workflow_call:

# Read-only token: pull requests from forks run with no write access. Actions are pinned to a commit, not a
# movable tag; Dependabot (.github/dependabot.yml) proposes the updates. Every job that installs uses .github/actions/install,
# whose pnpm store falls back to the newest entry of an older lockfile, so a dependency bump downloads only what changed.
permissions:
  contents: read

# Electron's postinstall downloads its binary (about 110 MB); only the desktop-smoke job runs it.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: pnpm data check
      - run: pnpm lint
      - run: pnpm typecheck

  # The full suite split by file across runners (vitest --shard), so its wall time stays flat as scenarios are added. Every shard runs
  # the same tests a local `pnpm test` does; together they are the whole suite.
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - run: pnpm test --shard=${{ matrix.shard }}/4

  # The release plan as the release workflow's plan job runs it: straight after checkout, with no dependencies installed,
  # so a script change that needs them fails here rather than on the next release. --bump patch plans a version even
  # when only repo commits came in since the last tag.
  release-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm --silent release plan --bump patch --dry-run > /dev/null

  # One result for branch protection and the release workflow: green only when the checks, every shard and the release
  # plan are.
  test:
    if: always()
    needs: [checks, shard, release-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checks, every shard and the release plan passed
        env:
          RESULTS: ${{ needs.checks.result }} ${{ needs.shard.result }} ${{ needs.release-plan.result }}
        run: test "$RESULTS" = "success success success"

  # The web build audited with axe-core in Chromium (docs/development.md, Commands). Its own job, so `test` stays as fast.
  a11y-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      # The browser only: the runner image has Chrome's libraries, and Playwright's own dependency install then only adds fonts, from a mirror slow enough
      # to take five minutes. The script installs them when a library is missing.
      - run: pnpm exec playwright install chromium
      - run: .github/scripts/linux-browser-deps.sh "$(node -e 'console.log(require("playwright").chromium.executablePath())')"
      - run: pnpm test a11y

  # The desktop app launched through Playwright's Electron driver under xvfb (docs/development.md, Commands): isolation, the drawn table, a save dialog for the backup, no request
  # off app://, and a relaunch that finds the save. Catalog only, no scans: the picture assertion is skipped here, and the booklets are packed only when present, so the release
  # job runs those. Its own job, like a11y-web, so `test` stays as fast. Skipped when release.yml calls this workflow: its desktop legs launch the packed app themselves, and
  # a failed desktop check must not hold back the APK and the IPA, which wait on these checks (docs/releasing.md, Jobs).
  desktop-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      # pnpm's side-effects cache can restore electron without running its postinstall (a store filled by a job that skipped the binary), so the binary is fetched explicitly; a no-op when it is there.
      - run: node node_modules/electron/install.js
      # The system libraries Chromium (and so Electron) needs, and xvfb for the display, only when the runner image lacks them.
      - run: .github/scripts/linux-browser-deps.sh node_modules/electron/dist/electron
      - run: pnpm desktop smoke

  # The Android and iOS bundles of a pull request with desktop work against main's (docs/architecture.md, Screens): each exported with --no-bytecode, and the job fails
  # unless each pair is byte-identical. The full history gives it the merge base; the script does nothing for a diff with no desktop work. Its own job, like a11y-web, and not
  # waited on by `test`, which stays as fast.
  phone-bundle:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - run: pnpm assets catalog
      - run: pnpm test phone-bundle --if-desktop-work

  # The pull request title becomes the squash commit's subject (.claude/rules/commit-standards.md, Squash).
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: pnpm commit:check "$TITLE"
      # The description becomes the squash commit's body: no attribution line (a session link, "Generated by [Claude Code]", a Claude co-author), and no keyword that closes an issue at the merge. It reaches the shell through env, never interpolated.
      - name: Pull request description
        env:
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$DESCRIPTION" > "$RUNNER_TEMP/description.md"
          pnpm commit:check --description "$RUNNER_TEMP/description.md"
      - name: Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm commit:check --range "$BASE..$HEAD"
