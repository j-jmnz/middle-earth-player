name: showcase

# Takes the README's screenshots: a Release simulator build of the app with every card picture packed and
# the showcase marker on, the flows in .maestro/showcase/ on the newest iPhone Pro and iPad Pro simulators in both themes, then the post-process.
# The images, the contact sheet and the manifest are a workflow artifact; with publish on, the images replace the one commit of the `showcase`
# branch, which the README links. Start it from the Actions tab or with `gh workflow run showcase.yml --ref main -f publish=true`.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the showcase branch's images with this run's, when every capture was taken"
        type: boolean
        default: false
      only:
        description: "Only these shots, comma separated (scripts/showcase/shots.ts); empty for all"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: showcase
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-latest
    timeout-minutes: 240
    outputs:
      complete: ${{ steps.capture.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/pack-assets
        env:
          # The asset mirror (docs/development.md, Asset mirror): the pack reads the pinned pictures and PDFs from it before their
          # sources, and pushes what it had to fetch. Without the secrets the pack reads the sources as before.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Capture
        id: capture
        continue-on-error: true
        run: |
          only=()
          if [ -n "${{ inputs.only }}" ]; then only=(--only "${{ inputs.only }}"); fi
          pnpm assets capture --build --out "$RUNNER_TEMP/raw" "${only[@]}"
      - name: Post-process
        run: pnpm assets showcase --from "$RUNNER_TEMP/raw" --out "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase
          path: ${{ runner.temp }}/out/
          retention-days: 14
      # Maestro's own logs and screenshots of each run, for a flow that failed.
      - if: steps.capture.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-logs
          path: |
            ~/.maestro/tests/
            ${{ runner.temp }}/raw/capture.json
          retention-days: 7

  publish:
    needs: capture
    if: ${{ inputs.publish && needs.capture.outputs.complete == 'true' && !inputs.only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase
          path: showcase
      # One orphan commit, replaced on every publish, so the images never pile up in the repository's history.
      - name: Replace the showcase branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          cd showcase
          rm -f contact.png
          git init -q -b showcase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "repo: README showcase captured from ${SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" showcase:showcase
