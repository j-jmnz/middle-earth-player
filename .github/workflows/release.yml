name: release

# Cuts a release: the next version from the commits since the last tag, the same checks as test.yml, a signed Android APK,
# an iOS IPA that players sign with SideStore or AltStore and the desktop installers for Windows, macOS and Linux, then the tag
# and a GitHub release with generated notes and the SideStore/AltStore source; and, when the Apple signing is set up, the iOS build on TestFlight as an optional extra.
# .claude/rules/release-standards.md sets the rules; docs/releasing.md says how to start it and what each job does. Start it
# from the Actions tab, with `gh workflow run release.yml --ref main -f bump=auto -f dry_run=false`, or with the GitHub
# API's workflow dispatch.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto reads the commits since the last release; patch, minor or major forces that bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Build and check only: the builds are workflow artifacts, no tag, release or TestFlight upload is made"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time; a second run waits instead of racing for the same tag.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      android_signed: ${{ steps.signing.outputs.android }}
      ios_signed: ${{ steps.signing.outputs.ios }}
      desktop_signed: ${{ steps.signing.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Plan the version and notes
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          TESTFLIGHT_URL: ${{ vars.TESTFLIGHT_URL }}
        run: pnpm --silent release plan --bump "$BUMP" --github-output $([ "$DRY_RUN" = "true" ] && echo --dry-run)
      # A release needs the Android key; the Apple signing is optional and turns on TestFlight (docs/releasing.md, Signing).
      - name: Signing
        id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          android=false; ios=false; desktop=false
          if [ -n "$ANDROID_KEYSTORE" ]; then android=true
          elif [ "$DRY_RUN" = "true" ]; then echo "::warning::No ANDROID_* secrets: the dry-run APK is signed with the debug key."
          else echo "::error::A release needs the ANDROID_* secrets (docs/releasing.md, Android key)."; exit 1; fi
          apple=0
          for value in "$ASC_KEY" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$TEAM_ID"; do
            if [ -n "$value" ]; then apple=$((apple + 1)); fi
          done
          if [ "$apple" = 4 ]; then ios=true
          elif [ "$apple" -gt 0 ]; then echo "::warning::The Apple signing is only partly set up, so TestFlight is skipped (docs/releasing.md, TestFlight (optional))."; fi
          # The desktop installers are unsigned unless the optional Windows certificate is set (docs/releasing.md, Desktop signing).
          if [ -n "$WINDOWS_CERT" ] && [ -n "$WINDOWS_CERT_PASSWORD" ]; then desktop=true
          elif [ -n "$WINDOWS_CERT$WINDOWS_CERT_PASSWORD" ]; then echo "::warning::The Windows certificate is only partly set up, so the Windows installer is unsigned (docs/releasing.md, Desktop signing)."; fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  checks:
    needs: plan
    uses: ./.github/workflows/test.yml

  # The catalog, the booklets and every card picture, packed once for both builds, so the pictures are downloaded once.
  assets:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Electron's postinstall downloads its binary (about 110 MB); only the desktop job runs it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    # The cache keys this job used, which the cleanup job keeps.
    outputs:
      caches: ${{ steps.pack.outputs.caches }}
    steps:
      # The downloaded pictures and their packed copies need more room than the runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY/PyPy"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pack
        uses: ./.github/actions/pack-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: |
            assets/catalog.db
            assets/booklets/
            assets/scans/
            src/catalog/version.ts
            src/screens/images/scan-map.ts
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # The builds start with the checks and the assets job, not after it: everything before the bundle runs while the assets
  # are packed, and "Wait for the assets" holds the build only if they are not ready by then (docs/releasing.md, Jobs).
  android:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # app.config.js stamps the version and versionCode from this.
      APP_VERSION: ${{ needs.plan.outputs.version }}
      APK_NAME: middle-earth-player-${{ needs.plan.outputs.tag }}${{ inputs.dry_run && '-dry-run' || '' }}.apk
    outputs:
      caches: ${{ steps.caches.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - id: install
        uses: ./.github/actions/install
      # The native build needs more room than the runner leaves free, but not until Gradle runs, so the deletion goes on
      # behind the next steps and the build waits for it. It starts only now: pnpm's setup runs the runner's own npm,
      # which lives in /usr/local/lib/node_modules.
      - name: Free disk space
        run: |
          nohup sh -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY/PyPy"; touch "$RUNNER_TEMP/disk.done"' > /dev/null 2>&1 &
      # Gradle installs the NDK React Native pins and the Android Gradle plugin's default CMake (3.22.1, which no module
      # overrides) while it configures, about a minute; this starts the same install behind the next steps, and the build
      # waits for it. If it fails, Gradle installs them itself.
      - name: Install the NDK, CMake and ccache
        run: |
          ndk=$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          echo "NDK_VERSION=$ndk" >> "$GITHUB_ENV"
          nohup sh -c "yes | '$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager' --install 'ndk;$ndk' 'cmake;3.22.1' > '$RUNNER_TEMP/sdk.log' 2>&1; touch '$RUNNER_TEMP/sdk.done'" > /dev/null 2>&1 &
          command -v ccache > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ccache; }
      - name: Generate the native project
        run: pnpm exec expo prebuild --platform android --no-install
      # Wrapper validation only: the Gradle home is cached below, keyed on the lockfile. The action's own cache keys on
      # the generated android/ files, which hold the stamped versionCode, so it never restored an entry.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # The build caches (docs/releasing.md, Caches). ccache keeps the compiled C++ of every native module, Gradle's home
      # keeps the dependencies and its build cache the outputs of the cacheable tasks, and Metro keeps its transforms.
      - id: caches
        name: Point the build caches at the runner
        env:
          PNPM_KEY: ${{ steps.install.outputs.key }}
        run: |
          # Every key this job saves under, named once here; the cleanup job keeps these and deletes what they replace.
          lock="${{ hashFiles('pnpm-lock.yaml') }}"
          metro="metro-android-${{ hashFiles('pnpm-lock.yaml', 'babel.config.js', 'metro.config.js') }}-$GITHUB_SHA"
          {
            echo "ccache=ccache-android-$lock"
            echo "gradle=gradle-modules-$lock"
            echo "metro=$metro"
            echo "keys=$PNPM_KEY ccache-android-$lock gradle-modules-$lock $metro"
          } >> "$GITHUB_OUTPUT"
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=1G"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            # The NDK is installed fresh on every run, so its clang's mtime says nothing; its version does.
            echo "CCACHE_COMPILERCHECK=string:ndk-$NDK_VERSION"
            # expo-modules-core compiles with a precompiled header.
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
            echo "EXPO_METRO_CACHE_RESTORE_DIR=$RUNNER_TEMP/metro-restored"
            echo "EXPO_METRO_CACHE_OUTPUT_DIR=$RUNNER_TEMP/metro"
          } >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.caches.outputs.ccache }}
          restore-keys: ccache-android-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The downloaded dependencies and the Gradle distribution, about 1 GB. Gradle's build cache (3.1 GB) supplied only
          # 137 of 963 tasks; ccache holds the compile time that matters.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.caches.outputs.gradle }}
          restore-keys: gradle-modules-
      # Metro reads the restored transforms and writes the ones this build used to its output directory, which is saved
      # under this commit, so the next release starts from them.
      - id: metro
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro
          key: ${{ steps.caches.outputs.metro }}
          restore-keys: |
            metro-android-${{ hashFiles('pnpm-lock.yaml', 'babel.config.js', 'metro.config.js') }}-
            metro-android-
      - name: Move the restored transforms aside
        run: |
          rm -rf "$EXPO_METRO_CACHE_RESTORE_DIR"
          if [ -d "$EXPO_METRO_CACHE_OUTPUT_DIR" ]; then mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"; fi
          mkdir -p "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
      - name: Wait for the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-assets.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
      - name: Build the release APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            signing=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          fi
          # The disk space and the NDK started in the background; each gets ten minutes.
          for marker in disk sdk; do
            for _ in $(seq 600); do if [ -e "$RUNNER_TEMP/$marker.done" ]; then break; fi; sleep 1; done
          done
          tail -n 3 "$RUNNER_TEMP/sdk.log" || true
          ccache --zero-stats > /dev/null
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a "${signing[@]}"
          ccache --show-stats
          mkdir -p "$RUNNER_TEMP/out"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$APK_NAME"
          rm -f "$RUNNER_TEMP/release.jks"
      # With ANDROID_CERT_SHA256 set (docs/releasing.md, Android key), an APK signed with any other key fails here, before a
      # release that could not install over the last one is published.
      - name: Verify the APK
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
          SIGNED: ${{ needs.plan.outputs.android_signed }}
        run: |
          apk="$RUNNER_TEMP/out/$APK_NAME"
          size=$(stat -c %s "$apk")
          echo "$APK_NAME: $((size / 1048576)) MB"
          # A GitHub release asset is at most 2 GiB.
          if [ "$size" -ge 2147483648 ]; then echo "::error::$APK_NAME is over the 2 GiB release asset limit"; exit 1; fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -m1 'SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}' > "$RUNNER_TEMP/out/certificate.sha256"
          cert=$(cat "$RUNNER_TEMP/out/certificate.sha256")
          expected=$(echo "$EXPECTED_CERT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ "$SIGNED" != "true" ]; then :
          elif [ -z "$expected" ]; then
            echo "::warning::ANDROID_CERT_SHA256 is not set; set it to $cert so a release signed with another key fails (docs/releasing.md, Android key)."
          elif [ "$cert" != "$expected" ]; then
            echo "::error::The APK is signed with certificate $cert, not ANDROID_CERT_SHA256 ($expected): players could not update over the last release."
            exit 1
          fi
          (cd "$RUNNER_TEMP/out" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/out/
          retention-days: 14
          compression-level: 0
      - if: steps.metro.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro
          key: ${{ steps.caches.outputs.metro }}

  ios:
    needs: [plan]
    # The Xcode 27 image: an app built with an SDK older than iOS 27.1 runs letterboxed on a folding iPhone's inner screen,
    # in a compatibility window that also ignores the table's landscape lock. macos-latest has only Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # app.config.js stamps the version, the build number and, for TestFlight, the signing team from these.
      APP_VERSION: ${{ needs.plan.outputs.version }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      SIGNED: ${{ needs.plan.outputs.ios_signed }}
      IPA_NAME: middle-earth-player-${{ needs.plan.outputs.tag }}${{ inputs.dry_run && '-dry-run' || '' }}.ipa
      MIN_IOS_SDK: "27.1"
    outputs:
      caches: ${{ steps.caches.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - id: install
        uses: ./.github/actions/install
      # The build caches (docs/releasing.md, Caches): Xcode's compilation cache keeps the compiled C, C++, Objective-C and
      # Swift of every target, keyed on the Xcode build as well, Metro keeps its transforms, and the CocoaPods and React
      # Native download caches keep the prebuilt React Native, its dependencies and Hermes.
      - id: caches
        name: Point the build caches at the runner
        env:
          PNPM_KEY: ${{ steps.install.outputs.key }}
        run: |
          {
            echo "EXPO_METRO_CACHE_RESTORE_DIR=$RUNNER_TEMP/metro-restored"
            echo "EXPO_METRO_CACHE_OUTPUT_DIR=$RUNNER_TEMP/metro"
          } >> "$GITHUB_ENV"
          xcode=$(xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')
          # Every key this job saves under, named once here; the cleanup job keeps these and deletes what they replace.
          lock="${{ hashFiles('pnpm-lock.yaml') }}"
          metro="metro-ios-${{ hashFiles('pnpm-lock.yaml', 'babel.config.js', 'metro.config.js') }}-$GITHUB_SHA"
          {
            echo "xcode=$xcode"
            echo "cas=xcode-cas-$xcode-$lock"
            echo "pods=pods-$lock"
            echo "metro=$metro"
            echo "keys=$PNPM_KEY xcode-cas-$xcode-$lock pods-$lock $metro"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: ${{ steps.caches.outputs.cas }}
          restore-keys: xcode-cas-${{ steps.caches.outputs.xcode }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
          key: ${{ steps.caches.outputs.pods }}
          restore-keys: pods-
      - id: metro
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro
          key: ${{ steps.caches.outputs.metro }}
          restore-keys: |
            metro-ios-${{ hashFiles('pnpm-lock.yaml', 'babel.config.js', 'metro.config.js') }}-
            metro-ios-
      - name: Move the restored transforms aside
        run: |
          rm -rf "$EXPO_METRO_CACHE_RESTORE_DIR"
          if [ -d "$EXPO_METRO_CACHE_OUTPUT_DIR" ]; then mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"; fi
          mkdir -p "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
      - name: Generate the native project
        run: pnpm exec expo prebuild --platform ios
      - name: Wait for the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-assets.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
      # One archive. Without the Apple signing it is unsigned; with it, Xcode signs it automatically through the App Store
      # Connect API key (docs/releasing.md, TestFlight (optional)). SideStore and AltStore re-sign either with the player's Apple ID.
      - name: Archive
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          archive="$RUNNER_TEMP/app.xcarchive"
          if [ "$SIGNED" = "true" ]; then
            echo "$ASC_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            signing=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          else
            signing=(CODE_SIGNING_ALLOWED=NO)
          fi
          # On the command line, so they reach every target, the pods included. Xcode 26's compilation cache works with
          # its explicit modules, which ccache cannot cache; the archive needs no editor index.
          set -o pipefail
          xcodebuild -quiet -workspace "$workspace" -scheme "$scheme" -configuration Release -destination generic/platform=iOS \
            -archivePath "$archive" archive "${signing[@]}" \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          du -sh ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex || true
          # The sideloading IPA: the app in Payload/, zipped.
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/ipa/Payload"
          cp -R "$archive"/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          # The SDK the app was built with: below iOS 27.1, iOS shows it letterboxed on a folding iPhone's inner screen.
          sdk=$(/usr/libexec/PlistBuddy -c "Print :DTSDKName" "$RUNNER_TEMP"/ipa/Payload/*.app/Info.plist)
          echo "Built with $sdk"
          lowest=$(printf '%s\n%s\n' "${sdk#iphoneos}" "$MIN_IOS_SDK" | sort -V | head -1)
          if [ "$lowest" != "$MIN_IOS_SDK" ]; then echo "::error::Built with $sdk; the release needs the iOS $MIN_IOS_SDK SDK or later"; exit 1; fi
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/out/$IPA_NAME" Payload)
          size=$(stat -f %z "$RUNNER_TEMP/out/$IPA_NAME")
          echo "$IPA_NAME: $((size / 1048576)) MB"
          # A GitHub release asset is at most 2 GiB.
          if [ "$size" -ge 2147483648 ]; then echo "::error::$IPA_NAME is over the 2 GiB release asset limit"; exit 1; fi
          (cd "$RUNNER_TEMP/out" && shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256")
          if [ "$SIGNED" != "true" ]; then exit 0; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${signing[@]}"
          mkdir -p "$RUNNER_TEMP/testflight"
          mv "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/testflight/middle-earth-player-${{ needs.plan.outputs.tag }}-testflight.ipa"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: ${{ runner.temp }}/out/
          retention-days: 14
          compression-level: 0
      - if: steps.metro.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro
          key: ${{ steps.caches.outputs.metro }}
      - if: env.SIGNED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testflight
          path: ${{ runner.temp }}/testflight/
          retention-days: 14
          compression-level: 0

  # The web export every desktop installer carries, built once: it is the same on every OS (docs/releasing.md, Jobs). Like the native builds it starts
  # beside the assets job and waits for them; CanvasKit's wasm and pdf.js are copied from node_modules, so only the pictures, booklets and catalog come from the artifact.
  web:
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The desktop build stamps its version from this, as app.config.js does for the phone builds.
      APP_VERSION: ${{ needs.plan.outputs.version }}
      EXPO_METRO_CACHE_RESTORE_DIR: ${{ github.workspace }}/../metro-web-restored
      EXPO_METRO_CACHE_OUTPUT_DIR: ${{ github.workspace }}/../metro-web
    outputs:
      caches: ${{ steps.caches.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: install
        uses: ./.github/actions/install
      - id: caches
        name: Name the Metro cache
        env:
          PNPM_KEY: ${{ steps.install.outputs.key }}
        run: |
          metro="metro-web-${{ hashFiles('pnpm-lock.yaml', 'babel.config.js', 'metro.config.js') }}-$GITHUB_SHA"
          echo "metro=$metro" >> "$GITHUB_OUTPUT"
          echo "keys=$PNPM_KEY $metro" >> "$GITHUB_OUTPUT"
      - id: metro
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../metro-web
          key: ${{ steps.caches.outputs.metro }}
          restore-keys: |
            metro-web-${{ hashFiles('pnpm-lock.yaml', 'babel.config.js', 'metro.config.js') }}-
            metro-web-
      - name: Move the restored transforms aside
        run: |
          rm -rf "$EXPO_METRO_CACHE_RESTORE_DIR"
          if [ -d "$EXPO_METRO_CACHE_OUTPUT_DIR" ]; then mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"; fi
          mkdir -p "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
      - name: Wait for the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/wait-for-assets.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
      - name: Export the web build for the desktop
        run: |
          pnpm --silent assets canvaskit pdfjs
          pnpm --silent desktop build --skip-assets
          du -sh desktop/build/web
      # include-hidden-files: the export has `_expo/.routes.json`, which the shell serves.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: desktop/build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - if: steps.metro.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../metro-web
          key: ${{ steps.caches.outputs.metro }}

  # One installer set per OS, packed from the same export and launched once before it is kept (docs/releasing.md, Jobs). Electron is downloaded here and
  # nowhere else, so its downloads are cached by the lockfile.
  desktop:
    needs: [plan, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest }
          - { os: macos, runner: macos-latest }
          - { os: windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # electron_config_cache is read by Electron's install and passed to electron-builder by `pnpm desktop pack` (its Electron zips); ELECTRON_BUILDER_CACHE holds its tools.
      - name: Point the Electron downloads at the runner
        run: |
          echo "electron_config_cache=$RUNNER_TEMP/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: desktop-electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: desktop-electron-${{ runner.os }}-
      - uses: ./.github/actions/install
      # pnpm's side-effects cache can restore electron without running its postinstall (a store filled by a job that skipped the binary), so the binary is fetched explicitly; a no-op when it is there.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js
      # The system libraries Electron needs and xvfb for the display (the smoke script runs itself under xvfb-run).
      - if: runner.os == 'Linux'
        run: |
          pnpm exec playwright install-deps chromium
          sudo apt-get install -y -q xvfb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: desktop/build/web
      # electron-builder signs the Windows installer when these are set (docs/releasing.md, Desktop signing); empty, it does not. Only the Windows leg gets them, and only when
      # the plan job found both secrets (desktop_signed), so one secret alone ships an unsigned installer instead of failing the build.
      - name: Pack the installers
        env:
          WIN_CSC_LINK: ${{ matrix.os == 'windows' && needs.plan.outputs.desktop_signed == 'true' && secrets.WINDOWS_CERT_BASE64 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.os == 'windows' && needs.plan.outputs.desktop_signed == 'true' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: pnpm desktop pack --skip-build
      # Every installer this OS makes must exist, stay under GitHub's 2 GiB asset limit and get a SHA-256 file (Node hashes, so no sha256sum or shasum).
      - id: stage
        name: Check and name the installers
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: pnpm --silent desktop stage --tag "$TAG" --out "$RUNNER_TEMP/out" --github-output $([ "$DRY_RUN" = "true" ] && echo --suffix -dry-run)
      # The packed app, not the checkout's: it must start, be cross-origin isolated, load a picture and a booklet page from its own bundle and
      # make no request off app://, and report the tag's version.
      - name: Launch the packed app
        timeout-minutes: 15
        env:
          APP: ${{ steps.stage.outputs.app }}
        run: pnpm desktop smoke --app "$APP" --require-bundle --expect-version "$APP_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Deletes the cache entries this run's keys replaced, on this run's branch only, once both builds have saved theirs; a
  # dry run tidies its own branch (docs/releasing.md, Caches).
  cleanup:
    needs: [assets, web, desktop, android, ios]
    # Runs after a failed build too, so the caches of the legs that finished are still tidied.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # The lockfile (a root file, so the sparse checkout holds it) names the desktop job's keys: a matrix job has no single output to carry them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Delete the replaced caches
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK: ${{ hashFiles('pnpm-lock.yaml') }}
          KEEP: ${{ needs.assets.outputs.caches }} ${{ needs.web.outputs.caches }} ${{ needs.android.outputs.caches }} ${{ needs.ios.outputs.caches }}
        run: |
          for os in Linux macOS Windows; do KEEP="$KEEP desktop-electron-$os-$LOCK"; done
          export KEEP="$KEEP node-cache-Windows-x64-pnpm-$LOCK"
          .github/scripts/prune-caches.sh

  publish:
    # The desktop build and the web export it needs are not waited on for success: a failed leg must not hold back the APK and the IPA
    # (docs/releasing.md, Jobs). The phone builds and the checks must all have succeeded.
    needs: [plan, checks, assets, android, ios, desktop]
    if: ${{ !cancelled() && !inputs.dry_run && needs.plan.result == 'success' && needs.checks.result == 'success' && needs.assets.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios
          path: ${{ runner.temp }}/out
      # The three OSes' installers and their .sha256 files, into the same folder.
      - if: ${{ needs.desktop.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/out
      - name: Write the notes and the SideStore/AltStore source
        env:
          BUMP: ${{ inputs.bump }}
          TAG: ${{ needs.plan.outputs.tag }}
          TESTFLIGHT_URL: ${{ vars.TESTFLIGHT_URL }}
          WINDOWS_SIGNED: ${{ needs.plan.outputs.desktop_signed }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          apk=$(ls "$RUNNER_TEMP"/out/*.apk)
          ipa=$(ls "$RUNNER_TEMP"/out/*.ipa)
          # A missing OS leaves its glob unexpanded, so the plan fails on it instead of publishing without that installer.
          # A desktop build that did not succeed ships nothing of it: the notes say so (--desktop-missing).
          desktop=(--desktop-missing)
          if [ "$DESKTOP_RESULT" = success ]; then
            desktop=()
            for file in "$RUNNER_TEMP"/out/*-win-x64.* "$RUNNER_TEMP"/out/*-mac-universal.* "$RUNNER_TEMP"/out/*-linux-x64.*; do
              case "$file" in *.sha256) ;; *) desktop+=(--desktop "$file") ;; esac
            done
          fi
          signed=(); if [ "$WINDOWS_SIGNED" = true ]; then signed=(--windows-signed); fi
          pnpm --silent release plan --bump "$BUMP" --expect "$TAG" --apk "$apk" --ipa "$ipa" "${desktop[@]}" "${signed[@]}" \
            --cert-sha256 "$(cat "$RUNNER_TEMP/out/certificate.sha256")" --notes "$RUNNER_TEMP/notes.md"
          pnpm --silent release source --tag "$TAG" --ipa "$ipa" --notes "$RUNNER_TEMP/notes.md" --out "$RUNNER_TEMP/out/source.json"
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          assets=("$RUNNER_TEMP"/out/*.apk "$RUNNER_TEMP"/out/*.apk.sha256 "$RUNNER_TEMP"/out/*.ipa "$RUNNER_TEMP"/out/*.ipa.sha256)
          if [ "$DESKTOP_RESULT" = success ]; then
            assets+=("$RUNNER_TEMP"/out/*-win-x64.* "$RUNNER_TEMP"/out/*-mac-universal.* "$RUNNER_TEMP"/out/*-linux-x64.*)
          fi
          # A patch cut from a release/vX.Y branch does not take "Latest" from a newer line on main.
          latest=true
          if [ "$GITHUB_REF_NAME" != main ]; then latest=false; fi
          gh release create "$TAG" "${assets[@]}" "$RUNNER_TEMP/out/source.json" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
      # The README's installs badge: every release's installer downloads, as one orphan commit on the `stats` branch that the badge
      # reads, replaced on every release so the counts never pile up in the history (scripts/release/installs.ts). A failure here
      # must not fail a release that is already out.
      - name: Update the installs count
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          stats="$RUNNER_TEMP/stats"
          mkdir -p "$stats"
          gh api --paginate --slurp "repos/$REPO/releases" > "$RUNNER_TEMP/releases.json"
          pnpm --silent release installs --releases "$RUNNER_TEMP/releases.json" --out "$stats/installs.json"
          cd "$stats"
          git init -q -b stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "repo: Count the installs at ${TAG}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" stats:stats
      # The TestFlight job reads the same notes; the tag now exists, so it cannot plan them again.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          retention-days: 14

  # The optional TestFlight channel, only when the Apple signing is set up. After the release, so a rerun of this job alone
  # finishes a release whose upload failed.
  testflight:
    needs: [plan, ios, publish]
    # An explicit test: the implicit success() would also skip it when the optional desktop build, upstream of publish, failed.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.ios_signed == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: testflight
          path: ${{ runner.temp }}/ios
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}
      # fastlane's pilot uploads the build, waits for Apple to process it, sets What to Test from the notes and gives it to
      # the external group, which sends the first build of each version to Beta App Review.
      - name: Upload to TestFlight
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PILOT_GROUPS: ${{ vars.TESTFLIGHT_GROUP || 'Players' }}
          PILOT_DISTRIBUTE_EXTERNAL: "true"
          PILOT_NOTIFY_EXTERNAL_TESTERS: "true"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          command -v fastlane >/dev/null || brew install fastlane
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.argv[1], JSON.stringify({ key_id: process.env.ASC_KEY_ID, issuer_id: process.env.ASC_ISSUER_ID, key: Buffer.from(process.env.ASC_KEY, "base64").toString("utf8"), in_house: false }))' "$RUNNER_TEMP/asc-key.json"
          # What to Test holds at most 4000 characters.
          export PILOT_CHANGELOG="$(head -c 3900 "$RUNNER_TEMP/notes.md")"
          fastlane pilot upload --api_key_path "$RUNNER_TEMP/asc-key.json" --ipa "$(ls "$RUNNER_TEMP"/ios/*.ipa)"
          rm -f "$RUNNER_TEMP/asc-key.json"
