name: commits

# The title, the description and the commit subjects of a pull request (.claude/rules/commit-standards.md). It is its own
# workflow so that an edit of the title or the description runs it again without the test jobs: the description becomes
# the squash commit's body, and a tool can add a line to it after the first run.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pull request title becomes the squash commit's subject (.claude/rules/commit-standards.md, Squash).
  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: pnpm commit:check "$TITLE"
      # The description becomes the squash commit's body: no attribution line (a session link, a Claude co-author), and no keyword that closes an issue at the merge. It reaches the shell through env, never interpolated.
      - name: Pull request description
        env:
          DESCRIPTION: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$DESCRIPTION" > "$RUNNER_TEMP/description.md"
          pnpm commit:check --description "$RUNNER_TEMP/description.md"
      - name: Commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm commit:check --range "$BASE..$HEAD"
