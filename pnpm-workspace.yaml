# sharp loads its prebuilt binary; its install script only builds from source.
ignoredBuiltDependencies:
  - sharp
# Settings only. This repo is one package.
nodeLinker: hoisted
# Every script runs its .ts file with Node's built-in type stripping; this hides the reparse notice.
nodeOptions: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
onlyBuiltDependencies:
  - better-sqlite3
  - sharp
  - unrs-resolver
