appId: com.middleearth.lcg
---
# Phase 10, moved onto the real resolution screen in phase 11 (the dev-only control is deleted). Written in a cloud session:
# it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json), which opens the fixture route: a real
# two-handed game of both starter decks parked on the first Resolution choice (src/campaign/fixtures). The loss is
# .maestro/scenario-1-loss.yaml.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-a-knife-in-the-dark-status
    text: "Locked"
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: sheet-outcome
    timeout: 30000
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution-choice-141078
    timeout: 30000
# Confirm is disabled until a choice is made; the sentence above it names what will be written.
- assertVisible:
    id: resolution-confirm
    enabled: false
- tapOn:
    id: resolution-choice-141078
- assertVisible:
    id: resolution-consequence
    text: "Gandalf's Delay is added to the campaign pool."
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: resolution-choice-141077
    timeout: 15000
- tapOn:
    id: resolution-choice-141077
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: resolution-consequence
      text: "Confirming records .* and unlocks A Knife in the Dark."
    timeout: 15000
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-a-knife-in-the-dark-status
    text: "Current"
- assertVisible:
    id: pool
    text: ".*Gandalf's Delay.*"
# Kill and relaunch: the log and the chosen cards are still in user.db.
- stopApp
- launchApp
# The last playthrough opens on the list's Continue panel; Path opens its path.
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-a-knife-in-the-dark-status
    text: "Current"
- assertVisible:
    id: pool
    text: ".*Gandalf's Delay.*"
# The briefing for scenario 2 deals the earned burden into the encounter deck.
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: deck-pick-0-stealth-and-steadfastness
    timeout: 15000
- tapOn:
    id: deck-pick-0-stealth-and-steadfastness
- assertVisible:
    id: briefing-checklist
- assertVisible: ".*Gandalf's Delay is shuffled into the encounter deck.*"
