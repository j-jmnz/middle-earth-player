appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `dum-lost` (scripts/e2e/angmar-awakened/the-battle-of-carn-dum.ts): a real two-handed game of The Battle of Carn Dûm (the One Deck and Defenders of Gondor lists, Easy),
# played after The Treachery of Rhudaur's win and parked on its loss. A loss has no reward screen and writes nothing (the Resolution is for a win): the scenario stays the next part, the boons the players took at the Setup do not join the Campaign Pool, and The Dread Realm is not offered.
# The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: dum-lost
      SCENARIO_ID: the-battle-of-carn-dum
# Back on the path, this part wrote nothing: neither boon is in the pool, what the earlier parts left is, and the scenario is still the next part.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Elrond's Champion.*"
- assertNotVisible:
    id: pool
    text: ".*Lore of Ancient Arnor.*"
- assertVisible:
    id: pool
    text: ".*Fend Off Despair.*"
- assertVisible:
    id: node-the-battle-of-carn-dum-status
    text: "Next"
