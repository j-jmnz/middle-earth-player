appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `dum-won` (scripts/e2e/angmar-awakened/the-battle-of-carn-dum.ts): a real two-handed game of The Battle of Carn Dûm (the One Deck and Defenders of Gondor lists, Easy),
# played after The Treachery of Rhudaur's win and parked on its win (Thaurdir destroyed on stage 2B). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds with the saved decklists' policy (docs/phases/STATUS.md), so this flow cannot run until a seed wins.
# The Campaign Setup offered each player one of the four boons (the first player took Elrond's Champion, the second Lore of Ancient Arnor, both added to the Campaign Pool); the Resolution (10188:B:1) asks nothing: it notes the damage on each hero and marks the characters that carry a
# Determination determined. The campaign has no XP. The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); the Crux dial (progress on Midwinter's Crux against the 15 that take Thaurdir's Indestructible away) is the scenario's own widget on stage 2B, read while the victory is on the table.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: dum-won
      SCENARIO_ID: the-battle-of-carn-dum
      NO_XP: "1"
      TABLE_WIDGET: angmar-crux
# The win left what The Treachery of Rhudaur left in the pool, and the two boons the players took at the Setup joined it.
- assertVisible:
    id: pool
    text: ".*Fend Off Despair.*"
- assertVisible:
    id: pool
    text: ".*Elrond's Champion.*"
- assertVisible:
    id: pool
    text: ".*Lore of Ancient Arnor.*"
# The Dread Realm is the next part of the campaign and is not playable yet, so the path offers it as coming soon.
- assertVisible:
    id: path-soon
