---
# TODO: the phase, and "Written in a cloud session: it has not run." Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `dum-won` (scripts/e2e/angmar-awakened/the-battle-of-carn-dum.ts): a real two-handed
# game of The Battle of Carn Dûm, parked on its win. The fixture is OPEN until scripts/e2e/fixtures.ts finds a game of that kind in its seeds (docs/phases/STATUS.md).
# The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); add this scenario's own assertions after the call.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: dum-won
      SCENARIO_ID: the-battle-of-carn-dum
      # A Resolution that asks one choice: the code of the card it offers, the choice's eyebrow text and the sentence the confirm line shows.
      # CHOICE_ID: "TODO"
      # CHOICE_PROMPT: "TODO"
      # CHOICE_CONSEQUENCE: "TODO"
# TODO: this scenario's own assertions on the path screen after the win (a carried card).
# The Dread Realm is the next part of the campaign and is not playable yet, so the path offers it as coming soon.
- assertVisible:
    id: path-soon
