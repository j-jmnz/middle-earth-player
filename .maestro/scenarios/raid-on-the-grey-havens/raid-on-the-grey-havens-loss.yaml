---
# Phase 42. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture `raid-lost` is a real two-handed game of
# Raid on the Grey Havens (The One Deck and the Defenders of Gondor lists) from the log the Voyage and Fate goldens' wins write (parts 1 and 2 recorded as won, so the path resumes Raid), parked on its
# loss: Calphon left play. A loss has no reward screen and writes nothing: the scenario stays current, no XP reaches the log. The path screen has no table-menu: the log is opened from `log-open`.
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: raid-lost
      SCENARIO_ID: raid-on-the-grey-havens
