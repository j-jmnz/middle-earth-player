appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `town-lost` (scripts/e2e/standalone-scenarios/the-battle-of-lake-town.ts): a real two-handed
# standalone game of The Battle of Lake-town (the One Deck and Defenders of Gondor lists, Easy), parked on its loss: Lake-town at 50 damage, every seat eliminated, or Smaug defeated for too few points, the rail reads Defeat.
# The fixture is OPEN until scripts/e2e/fixtures.ts finds one in its seeds (TOWN_SEEDS; docs/phases/STATUS.md): the scenario is not playable until its ledger lines are read.
# The steps are the shared subflow's (.maestro/subflows/standalone-loss.yaml): the defeat on the table, the outcome with the reason, and the Scenarios tab. A loss writes nothing, and a cycle has no campaign to check.
- runFlow:
    file: ../../subflows/standalone-loss.yaml
    env:
      FIXTURE: town-lost
