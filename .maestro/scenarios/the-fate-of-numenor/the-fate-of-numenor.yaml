---
# Phase 41. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `fate-won` (scripts/e2e/the-fate-of-numenor.ts): a real two-handed
# game of The Fate of Númenor, parked on its win (the Shrine to Morgoth is in the victory display). The fixture is OPEN: no win of the two starter decklists was found in 100 seeds, so `fate-won` is
# not committed and this flow cannot run until scripts/e2e/fixtures.ts writes one (docs/phases/STATUS.md). Confirming the win writes the XP from the campaign card (1 for each surviving player, Lush Jungle and Drowned Graves, the resources on the
# card, threat 40 or less) and, with part 1 won in the log, unlocks Raid on the Grey Havens (src/campaign/scenarios/the-fate-of-numenor/golden.test.ts pins the path). The fixture's log has part 1 recorded as won (the log Voyage Across Belegaer's golden win writes), so the path opens on the Fate and resumes it; the Fate node reads Won.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: fate-won
      SCENARIO_ID: the-fate-of-numenor
