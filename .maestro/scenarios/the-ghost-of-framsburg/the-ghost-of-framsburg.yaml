appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 58. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `framsburg-won` (scripts/e2e/the-ghost-of-framsburg.ts): a real two-handed game of The Ghost of Framsburg
# (the Defenders of Gondor and Swords of the Noldor lists, Easy) dealt from the log the first six parts' wins write, parked on its win (three Loot objectives controlled, The Cursed Tomb and Fram's Shade in the victory display). The fixture is OPEN:
# scripts/e2e/fixtures.ts found no win of the two starter decklists in its 100 seeds (docs/phases/STATUS.md), so this flow cannot run until a seed wins.
# The Resolution discovers the treasures the players control (no question), then asks the first player whether Gundabad Hunter or Gundabad Stalker joins the pool (12189:B:5, the eyebrow "Choose a burden", the seat label "Player 1 (first player) chooses"),
# then which of the first 2 Hazard cards discarded joins it (12189:B:6, "Choose a Hazard card for the pool"; no question when the two are one card). When the fixture exists, set CHOICE_ID to the Hunter's code, CHOICE_PROMPT to the eyebrow and
# CHOICE_CONSEQUENCE to "Gundabad Hunter is added to the campaign pool as a burden; Gundabad Stalker is not."; the Hazard card is a seeded draw, so CHOICE2_ID is the code or `e:`/`b:` tile id the fixture's seed discards, set when it exists.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: framsburg-won
      SCENARIO_ID: the-ghost-of-framsburg
      NO_XP: "true"
      # CHOICE_ID: "12191"
      # CHOICE_PROMPT: "Choose a burden"
      # CHOICE_CONSEQUENCE: "Gundabad Hunter is added to the campaign pool as a burden; Gundabad Stalker is not."
# The win wrote the campaign card's Resolution to the pool beside what the earlier parts put there: the burden chosen, and Misplaced Trust Roam Across Rhovanion earned.
- assertVisible:
    id: pool
    text: ".*Misplaced Trust.*"
# The win unlocks Mount Gundabad, whose node reads Next (scripts/checks/maestro.test.ts, path-soon).
- assertVisible:
    id: node-mount-gundabad-status
    text: "Next"
- assertNotVisible:
    id: path-soon
