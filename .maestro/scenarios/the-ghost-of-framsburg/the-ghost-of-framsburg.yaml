appId: com.middleearth.lcg
tags:
  - scenario
---
# TODO: the phase, and "Written in a cloud session: it has not run." Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `framsburg-won` (scripts/e2e/the-ghost-of-framsburg.ts): a real two-handed
# game of The Ghost of Framsburg, parked on its win. The fixture is OPEN until scripts/e2e/fixtures.ts finds a game of that kind in its seeds (docs/phases/STATUS.md).
# The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); add this scenario's own assertions after the call.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: framsburg-won
      SCENARIO_ID: the-ghost-of-framsburg
      # A Resolution that asks one choice: the code of the card it offers, the choice's eyebrow text and the sentence the confirm line shows.
      # CHOICE_ID: "TODO"
      # CHOICE_PROMPT: "TODO"
      # CHOICE_CONSEQUENCE: "TODO"
# The win unlocks Mount Gundabad, which the app cannot deal yet, so the path stops there and its node reads Coming soon (scripts/checks/maestro.test.ts, path-soon).
- assertVisible:
    id: node-mount-gundabad-status
    text: "Coming soon"
- assertVisible:
    id: path-soon
    text: "Mount Gundabad is coming soon."
