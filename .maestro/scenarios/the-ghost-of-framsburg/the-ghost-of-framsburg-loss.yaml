appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 58. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `framsburg-lost` (scripts/e2e/the-ghost-of-framsburg.ts): a real two-handed game of The Ghost of
# Framsburg (The One Deck and the Defenders of Gondor lists, Easy) dealt from the log the first six parts' wins write (Fire in the Night's two-handed win on the log of the five before it), parked on its loss (the threat: no seats
# remain). A loss has no reward screen and writes nothing: the scenario stays current, and neither Gundabad Hunter, Gundabad Stalker, a Hazard card nor a treasure reaches the log or the pool. The steps are the shared subflow's
# (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: framsburg-lost
      SCENARIO_ID: the-ghost-of-framsburg
# Back on the path, this part wrote none of its Ered Mithrin columns: neither burden is in the pool and the scenario is still the next part.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Gundabad (Hunter|Stalker).*"
- assertVisible:
    id: node-the-ghost-of-framsburg-status
    text: "Next"
