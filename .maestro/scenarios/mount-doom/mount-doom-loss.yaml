appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `doom-lost` (scripts/e2e/mount-doom.ts): a real two-handed game of Mount Doom (The One Deck and the Defenders of Gondor lists, after The
# Black Gate Opens' end), parked on its loss (a loss of the scenario's own is the threat at 99 under Dire, The One Ring leaving play, the last token coming off the campaign card or stage 4B's Fortitude test failed).
# A loss writes nothing, so the subflow's own assertions on the log screen are all it checks (docs/handover/agent-brief.md, Scenario procedure).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: doom-lost
      SCENARIO_ID: mount-doom
