appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `doom-won` (scripts/e2e/mount-doom.ts), the win of Mount Doom the destroy flow (mount-doom.yaml) opens, which is open until scripts/e2e/fixtures.ts finds one.
# The Resolution (146079) asks the first player to keep or destroy The One Ring: this flow keeps it, so the confirm line over the choice is in the danger tone and says the players lose the campaign, the settled screen is the end (calm, with the sentence "Confirming records the end:
# The One Ring is kept and the players lose the campaign."), and the road ends with the campaign lost (`path-complete`, in danger) and offers no next part. The campaign has no XP, and Mount Doom is its last part.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: doom-won
      SCENARIO_ID: mount-doom
      CHOICE_ID: "keep"
      CHOICE_PROMPT: "The players choose"
      CHOICE_CONSEQUENCE: ".*The One Ring is kept.*the players lose the campaign.*"
      NO_XP: "true"
      LAST_PART: "1"
- assertVisible:
    id: path-complete
    text: ".*The One Ring is kept. The players lose the campaign.*"
- assertNotVisible:
    id: begin
- assertNotVisible:
    id: path-soon
