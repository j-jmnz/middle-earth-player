appId: com.middleearth.player
tags:
  - scenario
---
# OPEN (2026-10-30): its fixture `breaking-solo` is not committed. It is a real true-solo game of Breaking of the Fellowship parked in the planning window of the
# round after stage 2B, dealt from the log of five scenarios no win has been found for (docs/phases/STATUS.md; see the-ring-goes-south.yaml). Run
# scripts/e2e/fixtures.ts --won when a chain of wins is found, then add `breaking-solo`, `breaking-pair`, `breaking-won` and `breaking-lost` to src/campaign/fixtures.ts.
# Phase 16. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json), which opens the fixture route.
# True solo after stage 2B: one dial, one staging area, one stage 3A of the player's choice. `table-area` is the table's one accessible line about the area it draws
# (src/play/words/scenarios/area.ts): "Staging area · Stage <stage 3A> · <n> cards · <active location>". No peek: there is no second dial and no second area.
- launchApp:
    clearState: true
- openLink: "middleearthplayer://e2e/breaking-solo"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: path-back
- assertVisible:
    id: continue-next
    text: "On the table: Breaking of the Fellowship"
- tapOn:
    id: continue
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: threat-0
- assertNotVisible:
    id: threat-1
- assertVisible:
    id: table-area
    text: "Staging area · Stage (Searching the Woods|Guard the Hobbits|The Seat of Amon Hen|Orc Hunting) · [0-9]+ cards? · .*"
# One staging area, not two: no player label on it, and the peek has nothing to show.
- assertNotVisible:
    id: table-area
    text: "Player 2.*"
- assertNotVisible:
    id: peek-text
# The threat panel lists this area's enemies only.
- tapOn:
    id: threat-0
- assertVisible:
    id: threat-panel
- tapOn:
    id: threat-panel-close
    optional: true
# Kill and relaunch: the save replays to the same area and stage.
- stopApp
- launchApp
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: continue
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: table-area
    text: "Staging area · .*"
