appId: com.middleearth.lcg
tags:
  - scenario
---
# OPEN (2026-10-30): its fixture `breaking-won` is not committed (see breaking-of-the-fellowship.yaml): a real two-handed game of Breaking of the Fellowship parked
# on its win (stage 4B defeated), dealt from the log of five scenarios no win has been found for.
# Phase 16. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json).
# 142060's Resolution: the first player chooses Followed by Night or Ill Fate, then each player names a hero they control as a captive (Frodo and Aragorn are never
# offered), each confirmed before the next is asked. Confirming records the burden and the captives, completes the Fellowship of the Ring and shows its six nodes won.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/breaking-won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-journey-in-the-dark-status
    text: "Won.*"
- assertVisible:
    id: node-breaking-of-the-fellowship-status
    text: "Next"
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
# The burden, the first player's choice.
- assertVisible: "Choose a burden"
- assertVisible:
    id: resolution-choice-142089
- assertVisible:
    id: resolution-choice-142090
- tapOn:
    id: resolution-choice-142089
- assertVisible:
    id: resolution-consequence
    text: ".*Followed by Night.*"
- tapOn:
    id: resolution-confirm
# A captive for each player, the first player's first.
- extendedWaitUntil:
    visible: "Name a captive"
    timeout: 15000
- assertVisible:
    id: resolution-seat
    text: "Player 1.*"
- tapOn:
    id: "resolution-choice-.*"
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: resolution-seat
      text: "Player 2.*"
    timeout: 15000
- assertVisible:
    id: resolution-answered-0
- tapOn:
    id: "resolution-choice-.*"
- tapOn:
    id: resolution-confirm
# What confirming writes: the burden and both captives; the Fellowship of the Ring is complete.
- extendedWaitUntil:
    visible:
      id: resolution-consequence
      text: "Confirming records .*Followed by Night.* in the campaign.*recorded as captive.*"
    timeout: 15000
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The Fellowship's six nodes show won, in order.
- assertVisible:
    id: node-a-shadow-of-the-past-status
    text: "Won.*"
- assertVisible:
    id: node-the-ring-goes-south-status
    text: "Won.*"
- assertVisible:
    id: node-journey-in-the-dark-status
    text: "Won.*"
- assertVisible:
    id: node-breaking-of-the-fellowship-status
    text: "Won.*"
# Kill and relaunch: the burden and the captives are on the log.
- stopApp
- launchApp
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-breaking-of-the-fellowship-status
    text: "Won.*"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertVisible:
    id: log-scenario-breaking-of-the-fellowship
    text: ".*rounds.*"
- assertVisible:
    id: log-captives
    text: ".*Player 1.*Player 2.*"
