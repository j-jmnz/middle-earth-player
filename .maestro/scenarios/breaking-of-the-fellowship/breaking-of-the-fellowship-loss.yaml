appId: com.middleearth.player
tags:
  - scenario
---
# OPEN (2026-10-30): its fixture `breaking-lost` is not committed (see breaking-of-the-fellowship.yaml): a real game of Breaking of the Fellowship parked on its
# loss at the separate stages, dealt from the log of five scenarios no win has been found for.
# Phase 16. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). A loss has no reward screen and writes
# nothing: no burden, no captive, no fallen hero; the log is as it was and the scenario stays the next one.
- launchApp:
    clearState: true
- openLink: "middleearthplayer://e2e/breaking-lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-journey-in-the-dark-status
    text: "Won.*"
- assertVisible:
    id: node-breaking-of-the-fellowship-status
    text: "Next"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertVisible:
    id: log-captives
    text: "None"
