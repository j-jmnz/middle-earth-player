appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `gollum-won` (scripts/e2e/shadows-of-mirkwood/the-hunt-for-gollum.ts): a real two-handed
# standalone game of The Hunt for Gollum (the One Deck and Defenders of Gondor lists, Easy), parked on its win: On the Trail defeated on stage 3, the rail reads Victory.
# The fixture is seed 520 of the finder (a win is rare for the auto-player on real decklists: it needs GOLLUM_SEEDS=520 or more; a rerun reaches the committed seed on its own).
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: gollum-won
      SCENARIO_ID: the-hunt-for-gollum
