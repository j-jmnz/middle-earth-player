appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 48. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `corsairs-lost` (scripts/e2e/the-city-of-corsairs.ts): a real two-handed
# game of The City of Corsairs (The One Deck and the Defenders of Gondor lists) from the log the first eight parts' wins write (parts 1 to 8 recorded as won, so the path resumes it), parked on its loss (the
# threat, or the Dream-chaser destroyed). A loss has no reward screen and writes nothing: the scenario stays current, no XP reaches the log and the campaign is not complete. The steps are the shared subflow's
# (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: corsairs-lost
      SCENARIO_ID: the-city-of-corsairs
