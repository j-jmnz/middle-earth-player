appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `eriador-lost` (scripts/e2e/angmar-awakened/the-wastes-of-eriador.ts): a real two-handed game of The Wastes of Eriador (the Defenders of Gondor and Swords of the
# Noldor lists, Easy), played after Deadmen's Dike's win and parked on its loss. A loss has no reward screen and writes nothing (the Resolution is for a win): the scenario stays the next part, Fend Off Despair and the Determinations are not in the pool, and the part after it is not offered.
# The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: eriador-lost
      SCENARIO_ID: the-wastes-of-eriador
# Back on the path, this part wrote nothing: neither Fend Off Despair nor a Determination is in the pool, and the scenario is still the next part.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Fend Off Despair.*"
- assertNotVisible:
    id: pool
    text: ".*Determination.*"
- assertVisible:
    id: node-the-wastes-of-eriador-status
    text: "Next"
