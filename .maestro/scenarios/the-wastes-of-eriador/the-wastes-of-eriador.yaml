appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `eriador-won` (scripts/e2e/angmar-awakened/the-wastes-of-eriador.ts): a real two-handed game of The Wastes of Eriador (the Defenders of Gondor
# and Swords of the Noldor lists, Easy), played after Deadmen's Dike's win and parked on its win (Pack Leader destroyed with 5 or more progress on stage 3B). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds with the scenario's golden
# policy (docs/phases/STATUS.md), so this flow cannot run until a seed wins. The Campaign Setup asked nothing (a Determination was added to each hand and to the pool, Fend Off Despair shuffled into the encounter deck, Arnor Ravaged staged with the damage the log noted,
# Mysterious Omens shuffled in from the pool); the Resolution (10171:B:1) asks nothing: confirming adds Fend Off Despair to the pool and marks the characters that carry a Determination determined. The campaign has no XP.
# The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); the Day and Night dial is the scenario's own widget, read while the victory is on the table.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: eriador-won
      SCENARIO_ID: the-wastes-of-eriador
      NO_XP: "1"
      TABLE_WIDGET: angmar-daynight
# The win left Fend Off Despair and the Determinations in the pool, with what Deadmen's Dike left there.
- assertVisible:
    id: pool
    text: ".*Fend Off Despair.*"
- assertVisible:
    id: pool
    text: ".*Determination.*"
- assertVisible:
    id: pool
    text: ".*Arnor Ravaged.*"
# The win unlocks Escape from Mount Gram.
- assertVisible:
    id: node-escape-from-mount-gram-status
    text: "Next"
- assertNotVisible:
    id: path-soon
