appId: com.middleearth.player
tags:
  - scenario
---
# OPEN (2026-10-26): its fixture `ford-start` is not committed. It is dealt from the log scenarios 1 and 2 write when they are
# won, and neither win has been found with the starter decks on this engine (docs/phases/STATUS.md; Maestro flows scenario-1.yaml
# and a-knife-in-the-dark-loss.yaml wait on the same chain). Run scripts/e2e/fixtures.ts --won when one is found, then add
# `ford-start`, `ford-won` and `ford-lost` to src/campaign/fixtures.ts.
# Phase 13. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json), which
# opens the fixture route. The fixture is a real game of Flight to the Ford, dealt in Campaign Mode and parked at its start.
# The table shows the Ring-bearer's life and the burden deck's count only for this scenario (mec109.ringbearers-life,
# mec109.burden-deck): scenario-1.yaml asserts neither is on a scenario 1 table. Maestro reads text and testIDs.
- launchApp:
    clearState: true
- openLink: "middleearthplayer://e2e/ford-start"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-a-knife-in-the-dark-status
    text: "Won.*"
- assertVisible:
    id: node-flight-to-the-ford-status
    text: "Next"
- assertVisible:
    id: node-the-ring-goes-south-status
    text: "Locked"
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
# The Setup line: the burden deck of five cards and the Ring-bearer's life at 15.
- assertVisible:
    id: life
- assertVisible:
    id: life-value
    text: "15"
- assertVisible:
    id: burden-deck
- assertVisible:
    id: burden-deck-value
    text: "5"
# Kill and relaunch: the replayed game shows the same numbers.
- stopApp
- launchApp
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: life-value
    text: "15"
- assertVisible:
    id: burden-deck-value
    text: "5"
