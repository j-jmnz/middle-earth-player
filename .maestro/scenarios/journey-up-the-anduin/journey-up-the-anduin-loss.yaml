appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 52. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `upanduin-lost` (scripts/e2e/journey-up-the-anduin.ts): a real two-handed game of
# Journey Up the Anduin (The One Deck and the Defenders of Gondor lists, Easy) from a new Ered Mithrin save, parked on its loss (the threat). A loss has no reward screen and writes nothing: the scenario stays
# current, no pool card, treasure or log line reaches the log. The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: upanduin-lost
      SCENARIO_ID: journey-up-the-anduin
# Back on the path, none of the Ered Mithrin columns of the log appeared: no treasure, no ally line, no Beldis box, no encounter card in the pool.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: wilderland-line
- assertNotVisible:
    id: path-pool-encounter
