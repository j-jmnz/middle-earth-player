appId: com.middleearth.player
tags:
  - scenario
---
# Phase 52. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `upanduin-won` (scripts/e2e/journey-up-the-anduin.ts): a real two-handed game of
# Journey Up the Anduin (The One Deck and the Defenders of Gondor lists, Easy) from a new Ered Mithrin save, parked on its win (stage 3, the Ford explored). The fixture is OPEN when scripts/e2e/fixtures.ts found no
# win of The One Deck and the Defenders of Gondor lists in its seeds (docs/phases/STATUS.md). The Resolution asks one choice, whether Turayn joins the pool or the oath line is written; the flow writes the line. Confirming records the win with
# A Growing Threat in the pool and unlocks Lost in Mirkwood, whose node reads Next (src/campaign/scenarios/journey-up-the-anduin/golden.test.ts pins the path).
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: upanduin-won
      SCENARIO_ID: journey-up-the-anduin
      CHOICE_ID: "line"
      CHOICE_PROMPT: "Turayn or the log"
      CHOICE_CONSEQUENCE: ".*oath of vigilance.*"
      NO_XP: "true"
# The win wrote the oath line and the pool's encounter cards to the Campaign Log (the path reads them under the Pool line).
- assertVisible:
    id: path-ally-lines
    text: ".*oath of vigilance.*"
- assertVisible:
    id: path-pool-encounter
    text: ".*A Growing Threat.*"
- assertVisible:
    id: node-lost-in-mirkwood-status
    text: "Next"
- assertNotVisible:
    id: path-soon
- assertNotVisible:
    id: begin
