appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `gondor-lost` (scripts/e2e/the-siege-of-gondor.ts): a real two-handed game of The Siege of Gondor (the Defenders of Gondor and
# Swords of the Noldor lists, Easy, after The Passing of the Grey Company's win), parked on its loss (a loss of the scenario's own is the players' threat at 50, every hero destroyed or Aragorn leaving play).
# A loss writes nothing, so the subflow's own assertions on the log screen are all it checks (docs/handover/agent-brief.md, Scenario procedure).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: gondor-lost
      SCENARIO_ID: the-siege-of-gondor
