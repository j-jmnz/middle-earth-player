appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `deep-won` (scripts/e2e/helms-deep.ts): a real two-handed game of Helm's Deep (The One Deck and the Defenders of Gondor lists, Easy, after The Uruk-hai's win), parked on its win (the 8 tokens on The Defense of Helm's Deep advanced the players to The King Rides Out, and no enemy is left in play). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds (docs/phases/STATUS.md).
# The Resolution (143077:B:1) asks nothing: each player holding a copy of Poisoned Counsels earns it. The campaign has no XP. The win unlocks The Road to Isengard, which the app cannot deal yet (scripts/checks/maestro.test.ts, path-soon).
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: deep-won
      SCENARIO_ID: helms-deep
      NO_XP: "true"
# The win unlocks The Road to Isengard, whose node reads Next and the path says it is coming soon.
- assertVisible:
    id: node-the-road-to-isengard-status
    text: "Next"
- assertVisible:
    id: path-soon
- assertNotVisible:
    id: begin
