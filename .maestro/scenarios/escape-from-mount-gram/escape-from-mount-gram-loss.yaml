appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `gram-lost` (scripts/e2e/angmar-awakened/escape-from-mount-gram.ts): a real two-handed game of Escape from Mount Gram (the Defenders of Gondor and Swords of the
# Noldor lists, Easy), played after The Wastes of Eriador's win and parked on its loss. A loss has no reward screen and writes nothing (the Resolution is for a win): the scenario stays the next part, no stolen card is logged, no boon of Loot the Dungeons is in the pool, and the
# part after it is not offered. The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: gram-lost
      SCENARIO_ID: escape-from-mount-gram
# Back on the path, this part wrote nothing: no boon of Loot the Dungeons is in the pool, and the scenario is still the next part.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Berelind.*"
- assertNotVisible:
    id: pool
    text: ".*Silverthorn.*"
- assertVisible:
    id: pool
    text: ".*Fend Off Despair.*"
- assertVisible:
    id: node-escape-from-mount-gram-status
    text: "Next"
