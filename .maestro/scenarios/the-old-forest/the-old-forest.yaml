appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `forest-won` (scripts/e2e/the-old-forest.ts): a real two-handed
# standalone game of The Old Forest (the One Deck and Defenders of Gondor lists, Easy), parked on its win: The Wicked Willow defeated with Withywindle out of play, the rail reads Victory.
# The fixture is OPEN until scripts/e2e/fixtures.ts finds one in its seeds (FOREST_SEEDS; docs/phases/STATUS.md): no seed of the first 100 wins with the saved decklists.
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: forest-won
      SCENARIO_ID: the-old-forest
