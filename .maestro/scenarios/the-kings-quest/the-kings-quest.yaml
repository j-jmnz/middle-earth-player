appId: com.middleearth.lcg
tags:
  - scenario
---
# TODO: the phase, and "Written in a cloud session: it has not run." Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `kingsquest-won` (scripts/e2e/the-kings-quest.ts): a real two-handed
# game of The King's Quest, parked on its win. The fixture is OPEN until scripts/e2e/fixtures.ts finds a game of that kind in its seeds (docs/phases/STATUS.md).
# The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); add this scenario's own assertions after the call.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: kingsquest-won
      SCENARIO_ID: the-kings-quest
      # A Resolution that asks one choice: the code of the card it offers, the choice's eyebrow text and the sentence the confirm line shows.
      # CHOICE_ID: "TODO"
      # CHOICE_PROMPT: "TODO"
      # CHOICE_CONSEQUENCE: "TODO"
# The win unlocks The Withered Heath, which the app cannot deal yet, so the path stops there and its node reads Coming soon (scripts/checks/maestro.test.ts, path-soon).
- assertVisible:
    id: node-the-withered-heath-status
    text: "Coming soon"
- assertVisible:
    id: path-soon
    text: "The Withered Heath is coming soon."
