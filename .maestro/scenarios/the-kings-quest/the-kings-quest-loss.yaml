appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 54. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `kingsquest-lost` (scripts/e2e/the-kings-quest.ts): a real two-handed game of
# The King's Quest (The One Deck and the Defenders of Gondor lists, Easy) dealt from the log Journey Up the Anduin's and Lost in Mirkwood's wins write, parked on its loss. A loss has no reward screen and writes
# nothing: the scenario stays current, and neither Isolde's line nor Abandoned Ruin, The Threat to Wilderland or Dagnir's Spawn reaches the log or the pool. The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: kingsquest-lost
      SCENARIO_ID: the-kings-quest
# Back on the path, this part wrote none of its Ered Mithrin columns: no Isolde line, none of its pool cards, and The Withered Heath stays locked behind it.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: path-ally-lines
    text: ".*Isolde is on the hunt.*"
- assertNotVisible:
    id: pool
    text: ".*Abandoned Ruin.*"
- assertVisible:
    id: node-the-kings-quest-status
    text: "Next"
