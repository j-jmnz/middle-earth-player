appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `dike-lost` (scripts/e2e/angmar-awakened/deadmens-dike.ts): a real two-handed game of Deadmen's Dike (the Defenders of Gondor and Swords of the Noldor
# lists, Easy), played after The Weather Hills' win and parked on its loss. A loss has no reward screen and writes nothing (the Resolution is for a win): the scenario stays the next part, Protect the Innocent keeps the damage the log noted, and the part after it is not offered.
# The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: dike-lost
      SCENARIO_ID: deadmens-dike
# Back on the path, this part wrote nothing: Arnor Ravaged is not in the pool, Protect the Innocent still is, and the scenario is still the next part.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Arnor Ravaged.*"
- assertVisible:
    id: node-deadmens-dike-status
    text: "Next"
