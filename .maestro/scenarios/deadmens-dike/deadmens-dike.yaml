appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `dike-won` (scripts/e2e/angmar-awakened/deadmens-dike.ts): a real two-handed game of Deadmen's Dike (the Defenders of Gondor and Swords of the Noldor
# lists, Easy), played after The Weather Hills' win and parked on its win (stage 2B defeated with 9 damage on Thaurdir). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds with the scenario's golden policy (docs/phases/STATUS.md),
# so this flow cannot run until a seed wins. The Campaign Setup asked nothing (Iârion's Pendant is attached, Protect the Innocent staged with the damage the log noted, Mysterious Omens shuffled in). The Resolution (10166:B:1) asks the first player which of Iârion's Pendant and
# Amarthiúl's Courage joins the pool and which player takes it ("Choose a player", as Temple of the Deceived's Recurring Nightmare does); confirming notes the damage on Protect the Innocent, puts Arnor Ravaged in its place and adds the burden Thaurdir carried. The campaign has
# no XP. The part after it, The Wastes of Eriador, is not playable yet, so the path says so (scripts/checks/maestro.test.ts, path-soon).
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/dike-won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
- assertNotVisible:
    id: life
# Thaurdir's damage dial, the players' way out of stage 2, is in the top bar.
- assertVisible:
    id: angmar-thaurdir
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
# The first player chooses the card and the player who takes it; the first Confirm sends the choice, the second writes the log.
- assertVisible: "Choose a player"
- tapOn: "Iârion's Pendant.*"
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: resolution-consequence
      text: "Confirming records.*"
    timeout: 15000
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-deadmens-dike-status
    text: "Won.*"
# The campaign has no XP.
- assertNotVisible:
    id: xp-line
- assertNotVisible:
    id: xp-open
# The win left Arnor Ravaged (in the place of Protect the Innocent), Mysterious Omens and the chosen card in the pool.
- assertVisible:
    id: pool
    text: ".*Arnor Ravaged.*"
- assertVisible:
    id: pool
    text: ".*Mysterious Omens.*"
- assertVisible:
    id: pool
    text: ".*Iârion's Pendant.*"
# The Wastes of Eriador cannot be dealt yet: the path says it is coming soon and offers no Begin.
- assertVisible:
    id: path-soon
