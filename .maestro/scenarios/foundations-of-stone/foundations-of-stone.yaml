appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `stone-won` (scripts/e2e/dwarrowdelf/foundations-of-stone.ts): a real two-handed
# standalone game of Foundations of Stone (the One Deck and Defenders of Gondor lists, Easy), parked on its win: Out of the Depths defeated, the rail reads Victory. The fixture is OPEN: no seed in 100 wins with the saved decklists (docs/phases/STATUS.md, Fixtures and Maestro).
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: stone-won
      SCENARIO_ID: foundations-of-stone
