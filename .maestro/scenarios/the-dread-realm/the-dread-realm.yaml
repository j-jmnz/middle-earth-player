appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `realm-won` (scripts/e2e/angmar-awakened/the-dread-realm.ts): a real two-handed game of The Dread Realm (the One Deck and Defenders of Gondor lists, Easy),
# played after The Battle of Carn Dûm's win and parked on its win (no location left in play at the end of the quest phase on stage 3). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds with the scenario's golden policy (docs/phases/STATUS.md), so this flow cannot run until a seed wins.
# The Campaign Setup offered each player a boon for their opening hand (both skipped); the Resolution (10193:B:1) asks nothing and writes nothing but the win. The campaign has no XP. This is the last part: the win completes the campaign, so the path has nothing to begin and says so.
# The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); stage 3's escape dial (the locations in play against none) is the scenario's own widget, read while the victory is on the table.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: realm-won
      SCENARIO_ID: the-dread-realm
      NO_XP: "1"
      LAST_PART: "1"
      TABLE_WIDGET: angmar-escape
# Every part is won: the path says so, has nothing to begin, offers a new campaign, and the pool keeps what the earlier parts left.
- assertVisible: ".*9 of 9 completed.*"
- assertNotVisible:
    id: begin
- assertVisible:
    id: path-complete
    text: "Angmar Awakened won\\. The players win the campaign!"
- assertVisible:
    id: path-new-campaign
- assertVisible:
    id: pool
    text: ".*Fend Off Despair.*"
