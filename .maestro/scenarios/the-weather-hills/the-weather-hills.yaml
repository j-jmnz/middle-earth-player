appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `hills-won` (scripts/e2e/angmar-awakened/the-weather-hills.ts): a real two-handed game of The Weather Hills (the Defenders of Gondor and Swords of the Noldor
# lists, Easy), played after Intruders in Chetwood's win and parked on its win (stage 2B defeated with Amon Forn out of play, Savage Counter-attack in play). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds with the scenario's golden
# policy (docs/phases/STATUS.md), so this flow cannot run until a seed wins.
# The Campaign Setup asked nothing (Protect the Innocent and Mysterious Omens are dealt from the pool). The Resolution (10159:B:1) asks nothing: it notes the damage on Protect the Innocent in the log, and Mysterious Omens stays in the pool (it was not defeated, so no boon is
# earned). The campaign has no XP. The win unlocks Deadmen's Dike, whose node reads Next (scripts/checks/maestro.test.ts, path-soon).
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: hills-won
      SCENARIO_ID: the-weather-hills
      NO_XP: "true"
      TABLE_WIDGET: angmar-savage
# The win left Protect the Innocent and Mysterious Omens in the pool.
- assertVisible:
    id: pool
    text: ".*Protect the Innocent.*"
- assertVisible:
    id: pool
    text: ".*Mysterious Omens.*"
# The win unlocks Deadmen's Dike.
- assertVisible:
    id: node-deadmens-dike-status
    text: "Next"
- assertNotVisible:
    id: path-soon
