appId: com.middleearth.lcg
tags:
  - scenario
---
# Phases 39b and 40. Written in a cloud session: it has not run (no phone, simulator or Maestro there). Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `sea-solo`
# (scripts/e2e/voyage-across-belegaer.ts, written by scripts/e2e/fixtures.ts): a real dealt game of Voyage Across Belegaer, true solo, from the blank log of a new Dream-chaser playthrough, parked on the first
# Sailing test's commit.
# The engine shifts the heading off-course as the test opens, before the commit (dcce.sailing-tests, step 1), so the dial reads Cloud at the commit. Which symbols the looked-at cards
# show depends on the deal, so the flow keeps the heading for every symbol and ends on the Done every look has; its assertions hold whatever the cards are.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/sea-solo"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: path-back
- tapOn:
    id: continue
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
# The Heading dial is in the top bar, already shifted off-course by the test; its word is clear text.
- assertVisible:
    id: heading
- assertVisible:
    id: heading-value
    text: "Cloud"
# The commit is a pick on the play area: the dock's List holds the characters that can be committed, the Dream-chaser among them.
- tapOn:
    id: sheet-list
- tapOn:
    id: "sheet-option-.*"
    index: 0
# The readout counts the cards the picks look at, the Dream-chaser as 2.
- assertVisible:
    id: readout-result
    text: ".*Looks at .* cards?.*"
- tapOn:
    id: sheet-primary
# The cards looked at stand in the strip, each a read-only row in the dock's List with its symbols.
- tapOn:
    id: sheet-list
- assertVisible:
    id: "sheet-look-.*"
# Keep the heading for each symbol found (a Keep arms on its first tap). A look with no symbol, or one the heading cannot use, has no Keep: it asks only for Done.
- repeat:
    while:
      visible:
        id: sheet-alternative
    commands:
      - tapOn:
          id: sheet-alternative
- assertVisible:
    id: sheet-primary
    text: "Done"
- assertVisible:
    id: heading-value
    text: "Cloud"
# Done discards the cards looked at; the quest commitment follows.
- tapOn:
    id: sheet-primary
- assertNotVisible:
    id: "sheet-look-.*"
