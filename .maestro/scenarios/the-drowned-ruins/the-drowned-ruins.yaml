appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 46. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `ruins-won` (scripts/e2e/the-drowned-ruins.ts): a real two-handed
# game of The Drowned Ruins (the Defenders of Gondor and Swords of the Noldor lists) from the log the first six parts' wins write, parked on its win (Shrine to Morgoth is in the victory display on stage 2). The
# fixture is OPEN when scripts/e2e/fixtures.ts found no win of the two starter decklists in its seeds (docs/phases/STATUS.md). The Resolution asks no choice (the Command and Círdan's Blessing copies chosen at the
# Campaign Setup join the pool); confirming writes the XP from the campaign card (1 for each surviving player, resources on the card, Na'asiyah's resources, no enemies in play, 5 or more Underwater locations in the
# victory display, Shrine to Morgoth's Grotto side, threat 40 or less, Ominous Fate) and, with parts 1 to 6 won in the log, reaches A Storm on Cobas Haven, the current part (src/campaign/scenarios/the-drowned-ruins/golden.test.ts pins the path).
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: ruins-won
      SCENARIO_ID: the-drowned-ruins
# A Storm on Cobas Haven is playable now (phase 47): its node is the next one, the path offers Begin, and nothing says it is coming soon.
- assertVisible:
    id: node-a-storm-on-cobas-haven-status
    text: "Next"
- assertNotVisible:
    id: path-soon
- assertVisible:
    id: begin
