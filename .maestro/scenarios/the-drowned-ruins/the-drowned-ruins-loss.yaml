# Phase 46. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `ruins-lost` (scripts/e2e/the-drowned-ruins.ts): a real two-handed game of
# The Drowned Ruins (The One Deck and the Defenders of Gondor lists) from the log the first six parts' wins write (parts 1 to 6 recorded as won, so the path resumes it), parked on its loss (Captain Sahír
# left play). A loss has no reward screen and writes nothing: the scenario stays current, no XP reaches the log. The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: ruins-lost
      SCENARIO_ID: the-drowned-ruins
