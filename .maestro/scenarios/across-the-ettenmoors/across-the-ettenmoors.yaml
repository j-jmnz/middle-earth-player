appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `ettenmoors-won` (scripts/e2e/angmar-awakened/across-the-ettenmoors.ts): a real two-handed game of Across the Ettenmoors (the Defenders of Gondor
# and Swords of the Noldor lists, Easy), played after Escape from Mount Gram's win and parked on its win (stage 3B defeated at 17 progress). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds with the saved decklists' policy
# (docs/phases/STATUS.md), so this flow cannot run until a seed wins. The Campaign Setup asked nothing (the five Losing Time were set aside); the Resolution (10182:B:1) asks nothing: confirming adds each Losing Time in the encounter deck or discard pile to the Campaign Pool and marks
# the characters that carry a Determination determined. The campaign has no XP. The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); the Losing Time clock is the scenario's own widget on the campaign card, read while the victory is on the table.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: ettenmoors-won
      SCENARIO_ID: across-the-ettenmoors
      NO_XP: "1"
      TABLE_WIDGET: angmar-losing
# The win left what Escape from Mount Gram left in the pool, and the Losing Time copies the campaign card did not reveal stay out of it.
- assertVisible:
    id: pool
    text: ".*Fend Off Despair.*"
- assertVisible:
    id: pool
    text: ".*Determination.*"
# The win unlocks The Treachery of Rhudaur.
- assertVisible:
    id: node-the-treachery-of-rhudaur-status
    text: "Next"
- assertNotVisible:
    id: path-soon
