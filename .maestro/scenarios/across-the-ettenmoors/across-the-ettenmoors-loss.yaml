appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `ettenmoors-lost` (scripts/e2e/angmar-awakened/across-the-ettenmoors.ts): a real two-handed game of Across the Ettenmoors (the Defenders of Gondor and Swords of the
# Noldor lists, Easy), played after Escape from Mount Gram's win and parked on its loss. A loss has no reward screen and writes nothing (the Resolution is for a win): the scenario stays the next part, no Losing Time joins the Campaign Pool, and the part after it is not offered.
# The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: ettenmoors-lost
      SCENARIO_ID: across-the-ettenmoors
# Back on the path, this part wrote nothing: no Losing Time is in the pool, and the scenario is still the next part.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Losing Time.*"
- assertVisible:
    id: pool
    text: ".*Fend Off Despair.*"
- assertVisible:
    id: node-across-the-ettenmoors-status
    text: "Next"
