appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 57. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `night-won` (scripts/e2e/fire-in-the-night.ts): a real two-handed game of Fire in the
# Night (The One Deck and the Defenders of Gondor lists, Easy) dealt from the log Journey Up the Anduin's, Lost in Mirkwood's, The King's Quest's, The Withered Heath's and Roam Across Rhovanion's wins write (Turayn,
# Melanwar and Isolde in a pool, Misplaced Trust for each player, a copy of a location and the treasures), parked on its win (Dagnir destroyed, three or more side quests in the victory display). The fixture is OPEN:
# scripts/e2e/fixtures.ts found no win of The One Deck and the Defenders of Gondor lists in its 100 seeds (docs/phases/STATUS.md), so this flow cannot run until a seed wins.
# The Resolution asks the first player whether Beldis joins a player's pool or the line "Beldis's care has bolstered the heroes' spirits" is written (12187:B:1, the eyebrow "Beldis or the log", the tile "line"); with 5 or more
# progress on Hrogar's Hill it then asks which of 3 random undiscovered treasures the players discover (12187:B:2, "Choose a treasure"); and each player in turn, the first player first, may remove a non-burden card of the
# pool (12187:B:4, "Remove a card from the pool", the seat labels "Player 1 (first player) chooses" and "Player 2 chooses"; Remove nothing is `resolution-decline`). When the fixture exists, set CHOICE_ID to the Beldis answer
# (the tile `line`, or the code of Beldis with the hero it goes to), CHOICE2_ID to the treasure it offers (its code, with CHOICE2_PROMPT "Choose 1 of the 3 random undiscovered treasures.*"), and answer the removals the same
# way with the tile ids the screen offers (the pool's cards, `p:<code>@<seat>`); a question the win does not ask is left out. The flow has no key for a third or fourth question, so a win that asks all four needs the
# subflow extended first.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: night-won
      SCENARIO_ID: fire-in-the-night
      NO_XP: "true"
# The win wrote the campaign card's Resolution to the pool beside the allies and burdens the earlier parts put there: Beldis for a player, unless the line was chosen, and the Misplaced Trust Roam Across Rhovanion earned.
- assertVisible:
    id: pool
    text: ".*Misplaced Trust.*"
# The win unlocks The Ghost of Framsburg, whose node reads Next (scripts/checks/maestro.test.ts, path-soon).
- assertVisible:
    id: node-the-ghost-of-framsburg-status
    text: "Next"
- assertNotVisible:
    id: path-soon
