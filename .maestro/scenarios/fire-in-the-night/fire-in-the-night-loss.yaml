appId: com.middleearth.player
tags:
  - scenario
---
# Phase 57. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `night-lost` (scripts/e2e/fire-in-the-night.ts): a real two-handed game of Fire in the
# Night (The One Deck and the Defenders of Gondor lists, Easy) dealt from the log Journey Up the Anduin's, Lost in Mirkwood's, The King's Quest's, The Withered Heath's and Roam Across Rhovanion's wins write, parked on its
# loss (the threat: no seats remain). A loss has no reward screen and writes nothing: the scenario stays current, and neither Beldis, a treasure nor a removal from the pool reaches the log or the pool. The steps are the shared
# subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: night-lost
      SCENARIO_ID: fire-in-the-night
# Back on the path, this part wrote none of its Ered Mithrin columns: Beldis is not in the pool and the scenario is still the next part.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Beldis.*"
- assertVisible:
    id: node-fire-in-the-night-status
    text: "Next"
