appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `returnmirkwood-won` (scripts/e2e/shadows-of-mirkwood/return-to-mirkwood.ts): a real two-handed
# standalone game of Return to Mirkwood (the One Deck and Defenders of Gondor lists, Easy), parked on its win: Ambush defeated with no enemy in play, the rail reads Victory. The fixture is OPEN: the seed finder found no such game
# in 600 seeds (docs/phases/STATUS.md, Open items); the flow waits for one.
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: returnmirkwood-won
      SCENARIO_ID: return-to-mirkwood
