appId: com.middleearth.player
tags:
  - scenario
---
# OPEN (2026-10-30): its fixture `moria-lost` is not committed (see journey-in-the-dark.yaml): it is a real game of Journey in the Dark parked on its loss,
# dealt from the log of four scenarios no win has been found for.
# Phase 15. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). A loss has no reward screen and writes
# nothing: the log is as it was, Breaking of the Fellowship stays locked.
- launchApp:
    clearState: true
- openLink: "middleearthplayer://e2e/moria-lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The log is unchanged: Journey in the Dark still current, Breaking of the Fellowship locked.
- assertVisible:
    id: node-journey-in-the-dark-status
    text: "Next"
- assertVisible:
    id: node-breaking-of-the-fellowship-status
    text: "Locked"
