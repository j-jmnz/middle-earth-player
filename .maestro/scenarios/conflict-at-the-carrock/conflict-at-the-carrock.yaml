appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `carrock-won` (scripts/e2e/shadows-of-mirkwood/conflict-at-the-carrock.ts): a real two-handed
# standalone game of Conflict at the Carrock (the One Deck and Defenders of Gondor lists, Easy), parked on its win: Against the Trolls defeated on stage 2, the rail reads Victory.
# The fixture is OPEN: no seed up to 300 gives the auto-player (the goldens' fighting policy with the real decklists' card play) a win with the real decklists, which cannot kill four Trolls of 10 hit points before the threat reaches 50
# (docs/phases/STATUS.md). The flow runs once scripts/e2e/fixtures.ts finds one (CARROCK_SEEDS).
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: carrock-won
      SCENARIO_ID: conflict-at-the-carrock
