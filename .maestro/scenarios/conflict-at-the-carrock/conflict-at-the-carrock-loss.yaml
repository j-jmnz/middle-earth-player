---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `carrock-lost` (scripts/e2e/shadows-of-mirkwood/conflict-at-the-carrock.ts): a real two-handed
# standalone game of Conflict at the Carrock (the One Deck and Defenders of Gondor lists, Easy), parked on its loss: every seat eliminated, the rail reads Defeat.
# The steps are the shared subflow's (.maestro/subflows/standalone-loss.yaml): the defeat on the table, the outcome with the reason, and the Scenarios tab. A loss writes nothing, and a cycle has no campaign to check.
- runFlow:
    file: ../../subflows/standalone-loss.yaml
    env:
      FIXTURE: carrock-lost
