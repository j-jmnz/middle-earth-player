appId: com.middleearth.player
tags:
  - scenario
---
# Phase 33. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture `nibin-dum-lost` is a real
# two-handed game of The Caves of Nibin-Dûm from the log a real `oath-won` writes, parked on its loss (the first seed the auto-player loses; the reducer records the reason,
# which the Resolution screen shows). A loss has no reward screen and writes nothing: The Caves of Nibin-Dûm stays current, the campaign is not complete, no Ranger Sense is
# earned or carried over, and the Campaign Pool is as The Oath left it (the loss neither adds nor removes a card). The path screen has no table-menu: the log is opened from `log-open`.
- launchApp:
    clearState: true
- openLink: "middleearthplayer://e2e/nibin-dum-lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
# The Lost Resolution names why: the reason the reducer recorded above the consequence line.
- assertVisible:
    id: resolution-reason
    text: ".+"
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The log is unchanged: The Oath done, The Caves of Nibin-Dûm still current, nothing carried over.
- assertVisible:
    id: node-the-oath-status
    text: "Won.*"
- assertVisible:
    id: node-the-caves-of-nibin-dum-status
    text: "Next"
- assertVisible: ".*1 of 2 completed.*"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertNotVisible:
    id: log-carry-over
- assertVisible:
    id: log-scenario-the-caves-of-nibin-dum
    text: ".*Not completed.*"
