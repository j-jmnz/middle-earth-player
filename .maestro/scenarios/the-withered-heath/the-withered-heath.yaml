appId: com.middleearth.lcg
tags:
  - scenario
---
# TODO: the phase, and "Written in a cloud session: it has not run." Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `heath-won` (scripts/e2e/the-withered-heath.ts): a real two-handed
# game of The Withered Heath, parked on its win. The fixture is OPEN until scripts/e2e/fixtures.ts finds a game of that kind in its seeds (docs/phases/STATUS.md).
# The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml); add this scenario's own assertions after the call.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: heath-won
      SCENARIO_ID: the-withered-heath
      # A Resolution that asks one choice: the code of the card it offers, the choice's eyebrow text and the sentence the confirm line shows.
      # CHOICE_ID: "TODO"
      # CHOICE_PROMPT: "TODO"
      # CHOICE_CONSEQUENCE: "TODO"
# TODO: this scenario's own assertions on the path screen after the win (the next part's node, a carried card).
# The win unlocks Roam Across Rhovanion, which the app cannot deal yet, so the path stops there and its node reads Coming soon (scripts/checks/maestro.test.ts, path-soon).
- assertVisible:
    id: node-roam-across-rhovanion-status
    text: "Coming soon"
- assertVisible:
    id: path-soon
    text: "Roam Across Rhovanion is coming soon."
- assertNotVisible:
    id: begin
