appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 55. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `heath-lost` (scripts/e2e/the-withered-heath.ts): a real two-handed game of
# The Withered Heath (the Defenders of Gondor and Swords of the Noldor lists, Easy) dealt from the log Journey Up the Anduin's, Lost in Mirkwood's and The King's Quest's wins write, parked on its loss. A loss has no
# reward screen and writes nothing: the scenario stays current, and no Accolade boon, Song boon or treasure reaches the log or the pool. The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: heath-lost
      SCENARIO_ID: the-withered-heath
# Back on the path, this part wrote none of its Ered Mithrin columns: no Song boon in the pool, and Roam Across Rhovanion stays behind it.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Canny Huntsman.*"
- assertNotVisible:
    id: pool
    text: ".*Master of the Hunt.*"
- assertVisible:
    id: node-the-withered-heath-status
    text: "Next"
