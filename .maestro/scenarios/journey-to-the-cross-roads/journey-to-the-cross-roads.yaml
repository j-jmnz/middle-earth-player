appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `roads-won` (scripts/e2e/journey-to-the-cross-roads.ts): a real two-handed game of Journey to the Cross-roads
# (The One Deck and the Defenders of Gondor lists, Easy, the saga Frodo as the Ring-bearer with The One Ring, after The Passage of the Marshes' win), parked on its win (The Cross-roads explored with the Harad deck empty). The fixture is
# OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds: 600 seeds found none (docs/phases/STATUS.md).
# The Resolution (144069) asks no choice: it earns a Brace of Coneys for each player who chose one at Setup (both seats took the resources) and writes the enemies under The Black Gate to the log. The campaign has no XP.
# The Gate dial (roads-gate) is on the table from the start, while The Black Gate is in play, so the flow reads it while the victory is on the table.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: roads-won
      SCENARIO_ID: journey-to-the-cross-roads
      TABLE_WIDGET: roads-gate
      NO_XP: "true"
# The win unlocks Shelob's Lair, whose node reads Next and the path offers Begin (the part is playable, so no line says it is coming soon).
- assertVisible:
    id: node-shelobs-lair-status
    text: "Next"
- assertVisible:
    id: begin
- assertNotVisible:
    id: path-soon
