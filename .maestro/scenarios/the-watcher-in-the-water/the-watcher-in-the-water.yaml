appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `water-won` (scripts/e2e/dwarrowdelf/the-watcher-in-the-water.ts): a real two-handed
# standalone game of The Watcher in the Water (the One Deck and Defenders of Gondor lists, Easy), parked on its win: The Seething Lake defeated with 5 progress and 3 victory points, the rail reads Victory.
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: water-won
      SCENARIO_ID: the-watcher-in-the-water
