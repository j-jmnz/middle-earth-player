appId: com.middleearth.player
tags:
  - scenario
---
# Phase 56. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `rhovanion-lost` (scripts/e2e/roam-across-rhovanion.ts): a real two-handed game of
# Roam Across Rhovanion (The One Deck and the Defenders of Gondor lists, Easy) dealt from the log Journey Up the Anduin's, Lost in Mirkwood's, The King's Quest's and The Withered Heath's wins write, parked on its loss
# (the threat). A loss has no reward screen and writes nothing: the scenario stays current, and no Misplaced Trust, Urdug's Cunning or location for the pool reaches the log or the pool. The steps are the shared subflow's
# (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: rhovanion-lost
      SCENARIO_ID: roam-across-rhovanion
# Back on the path, this part wrote none of its Ered Mithrin columns: no Misplaced Trust or Urdug's Cunning in the pool, and Fire in the Night stays behind it.
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: pool
    text: ".*Misplaced Trust.*"
- assertNotVisible:
    id: pool
    text: ".*Urdug's Cunning.*"
- assertVisible:
    id: node-roam-across-rhovanion-status
    text: "Next"
