appId: com.middleearth.player
tags:
  - scenario
---
# Phase 44. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `depths-won` (scripts/e2e/the-thing-in-the-depths.ts): a real two-handed
# game of The Thing in the Depths, parked on its win (The Thing in the Depths is destroyed). The fixture is OPEN when scripts/e2e/fixtures.ts found no win of the two starter decklists in its seeds
# (docs/phases/STATUS.md). The Resolution first asks whether Come Together joins the Campaign Pool (the first player's choice, "Choose a boon"); confirming writes the XP from the campaign card (1 for each surviving
# player, Captain Sahír and Na'asiyah with 5 resources, Sea Serpent, no damage on a hero, threat 40 or less, Ominous Fate) and, with parts 1 to 4 won in the log, unlocks Temple of the Deceived
# (src/campaign/scenarios/the-thing-in-the-depths/golden.test.ts pins the path). The fixture's log has parts 1 to 4 recorded as won (the logs the Voyage, Fate, Raid and Flight goldens' wins write), so the path opens on The Thing in the Depths
# and resumes it; its node reads Won.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: depths-won
      SCENARIO_ID: the-thing-in-the-depths
      CHOICE_ID: "11195"
      CHOICE_PROMPT: "Choose a boon"
      CHOICE_CONSEQUENCE: ".*Come Together.*"
