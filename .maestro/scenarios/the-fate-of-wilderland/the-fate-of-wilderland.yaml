appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 60. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `wilderland-won` (scripts/e2e/the-fate-of-wilderland.ts): a real two-handed game of The Fate of Wilderland
# (the Defenders of Gondor and Swords of the Noldor lists, Easy) dealt from the log the first eight parts' wins write (parts 1 to 8 recorded as won, so the path resumes it; Misplaced Trust for each player, Gundabad Hunter or Gundabad Stalker,
# the treasures the earlier parts discovered), parked on its win (Urdug destroyed once The Heroes' Defense held 5 resources for each player). The fixture is OPEN when scripts/e2e/fixtures.ts found no win of the two starter decklists in its
# seeds (docs/phases/STATUS.md), so this flow cannot run until a seed wins.
# The Resolution asks no choice ("The players win the campaign!") and writes nothing to the pool, the treasures or the lines; confirming completes the campaign, as The City of Corsairs' win does: the path has nothing to begin and its foot
# reads "Campaign complete." (src/campaign/scenarios/the-fate-of-wilderland/golden.test.ts and campaign.test.ts pin the path). Ered Mithrin has no XP and The Fate of Wilderland is its last part.
# The steps are the shared subflow's (.maestro/subflows/scenario-win.yaml).
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: wilderland-won
      SCENARIO_ID: the-fate-of-wilderland
      NO_XP: "true"
      # The last part of the campaign: the flow below reads the campaign as complete.
      LAST_PART: "1"
# Every scenario is won: the path says so, has nothing to begin, and the win wrote no new pool card (Misplaced Trust, which Roam Across Rhovanion earned, stays).
- assertVisible: ".*9 of 9 completed.*"
- assertNotVisible:
    id: begin
- assertVisible:
    id: path-complete
    text: "Campaign complete\\."
- assertVisible:
    id: pool
    text: ".*Misplaced Trust.*"
