tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `lair-won` (scripts/e2e/shelobs-lair.ts): a real two-handed game of Shelob's Lair (The One Deck and the Defenders of Gondor
# lists, Easy, the saga Frodo as the Ring-bearer with The One Ring and A Heavy Burden, after Journey to the Cross-roads' win), parked on its win (stage 3B is defeated with Shelob and Gollum in the victory display). The fixture is OPEN until
# scripts/e2e/fixtures.ts finds a win of those lists in its seeds (docs/phases/STATUS.md).
# The Resolution (144073) asks nothing: A Heavy Burden joins the campaign pool. The campaign has no XP, and Shelob's Lair is its last part, so the flow passes NO_XP and LAST_PART.
# Shelob's resource tokens are shown as tokens on her card (no widget of their own), so the flow passes no TABLE_WIDGET.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: lair-won
      SCENARIO_ID: shelobs-lair
      NO_XP: "true"
      LAST_PART: "1"
