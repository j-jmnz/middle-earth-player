appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `ungol-lost` (scripts/e2e/the-tower-of-cirith-ungol.ts): a real two-handed game of The Tower of Cirith Ungol (The One Deck and the Defenders of Gondor
# list, after The Battle of the Pelennor Fields' win), parked on its loss (a loss of the scenario's own is the threat at 50 or The One Ring leaving play, the hero that carries it destroyed or discarded).
# A loss writes nothing, so the subflow's own assertions on the log screen are all it checks (docs/agents/agent-brief.md, Scenario procedure).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: ungol-lost
      SCENARIO_ID: the-tower-of-cirith-ungol
