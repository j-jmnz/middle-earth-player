appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `marshes-won` (scripts/e2e/the-passage-of-the-marshes.ts): a real two-handed game of The Passage of the Marshes
# (The One Deck and the Defenders of Gondor lists, Easy, the saga Frodo as the Ring-bearer with The One Ring, after The Road to Isengard's win), parked on its win (the first player controls Sméagol and stage 3B is defeated). The fixture is
# OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds (docs/phases/STATUS.md).
# The Resolution (144067) asks each player in turn for a permanent +2 starting threat penalty or a copy of The Searching Eye: the first player takes the penalty (the first option), the second player the Eye. The campaign has no XP. The win unlocks
# Journey to the Cross-roads, which the app cannot deal yet.
# The Mire dial (marshes-mire) and Gollum's hit points (marshes-gollum) are on the table only while a location with Mire or Gollum is in play, so the win's table has neither and the flow passes no TABLE_WIDGET.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: marshes-won
      SCENARIO_ID: the-passage-of-the-marshes
      CHOICE_ID: "penalty"
      CHOICE_PROMPT: "The players choose"
      CHOICE_CONSEQUENCE: ".*Player 1 takes a permanent \\+2 starting threat penalty.*"
      CHOICE2_SEAT: "Player 2 chooses"
      CHOICE2_ID: "searchingEye"
      CHOICE2_PROMPT: "The players choose"
      CHOICE2_CONSEQUENCE: ".*Player 2 earns 1 copy of The Searching Eye.*"
      NO_XP: "true"
# The win unlocks Journey to the Cross-roads, whose node reads Next while the line under the road says it is coming soon (scripts/checks/maestro.test.ts, path-soon): the part is not playable yet.
- assertVisible:
    id: node-journey-to-the-cross-roads-status
    text: "Next"
- assertVisible:
    id: path-soon
- assertNotVisible:
    id: begin
