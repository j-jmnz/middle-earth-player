appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `erech-won` (scripts/e2e/standalone-scenarios/the-stone-of-erech.ts): a real two-handed
# standalone game of The Stone of Erech (the One Deck and Defenders of Gondor lists, Easy), parked on its win: The Shadow Host defeated with Derufin in a player's area, the rail reads Victory.
# The fixture is OPEN until scripts/e2e/fixtures.ts finds a game of that kind in its seeds (docs/phases/STATUS.md).
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: erech-won
      SCENARIO_ID: the-stone-of-erech
