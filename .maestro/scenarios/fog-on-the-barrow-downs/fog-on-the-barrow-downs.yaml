appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `downs-won` (scripts/e2e/standalone-scenarios/fog-on-the-barrow-downs.ts): a real two-handed
# standalone game of Fog on the Barrow-downs (the One Deck and Defenders of Gondor lists, Easy), parked on its win: stage 3B defeated with every player at it and Standing Stones in the victory display, the rail reads Victory.
# The fixture is OPEN until scripts/e2e/fixtures.ts finds one in its seeds (DOWNS_SEEDS; docs/phases/STATUS.md): no seed of the first 500 wins with the saved decklists.
# The steps are the shared subflow's (.maestro/subflows/standalone-win.yaml): the victory on the table, the outcome with its score, and the Scenarios tab, where the scenario's tile reads as won.
# A cycle has no campaign: no Resolution, no XP and no next part, so the flow checks nothing more.
- runFlow:
    file: ../../subflows/standalone-win.yaml
    env:
      FIXTURE: downs-won
      SCENARIO_ID: fog-on-the-barrow-downs
