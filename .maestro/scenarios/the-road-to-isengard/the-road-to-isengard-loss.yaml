appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `isengard-lost` (scripts/e2e/the-road-to-isengard.ts): a real two-handed game of The Road to Isengard (The One Deck and the Defenders of Gondor lists, Easy), parked on its loss (a loss of the scenario's own is the players' threat at 50, every hero destroyed or a hand empty on stage 3B). The fixture is OPEN until scripts/e2e/fixtures.ts finds a loss of those lists in its seeds (docs/phases/STATUS.md).
# A loss writes nothing, so the subflow's own assertions on the log screen are all it checks (docs/handover/agent-brief.md, Scenario procedure).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: isengard-lost
      SCENARIO_ID: the-road-to-isengard
