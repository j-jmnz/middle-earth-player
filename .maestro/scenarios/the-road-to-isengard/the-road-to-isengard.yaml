appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `isengard-won` (scripts/e2e/the-road-to-isengard.ts): a real two-handed game of The Road to Isengard (The One Deck and the Defenders of Gondor lists, Easy, after Helm's Deep's win), parked on its win (Saruman has taken 6 damage, so his gate is clear, and stage 3B is defeated). The fixture is OPEN until scripts/e2e/fixtures.ts finds a win of those lists in its seeds (docs/phases/STATUS.md).
# The Resolution (143081) asks nothing: the hands at the win earn Saruman's Voice (a player with 3 or fewer cards) and the Palantir of Orthanc for the first player (a player with 3 or more). The campaign has no XP. The win unlocks The Passage of the Marshes, which the app cannot deal yet (scripts/checks/maestro.test.ts, path-soon).
# TABLE_WIDGET: Saruman's Gate dial (143048:A:2), read while the victory is on the table.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: isengard-won
      SCENARIO_ID: the-road-to-isengard
      NO_XP: "true"
      TABLE_WIDGET: isengard-gate
# The win unlocks The Passage of the Marshes, whose node reads Next and the path says it is coming soon.
- assertVisible:
    id: node-the-passage-of-the-marshes-status
    text: "Next"
- assertVisible:
    id: path-soon
- assertNotVisible:
    id: begin
