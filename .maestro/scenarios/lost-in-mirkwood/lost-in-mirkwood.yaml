appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 53. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `lostmirk-won` (scripts/e2e/lost-in-mirkwood.ts): a real two-handed game of
# Lost in Mirkwood (the Defenders of Gondor and Swords of the Noldor lists, Easy) dealt from the log Journey Up the Anduin's win writes (Turayn in a pool, A Growing Threat and the cards set aside in the encounter pool, a
# treasure discovered), parked on its win (Escape from Taur-nu-fuin, the stage defeated). The fixture is OPEN when scripts/e2e/fixtures.ts found no win of the two starter decklists in its seeds (docs/phases/STATUS.md).
# The Resolution asks one choice, whether Melanwar joins the pool or the guidance line is written (12168:B:1); the flow writes the line. It then writes the treasure the players control and the Spiders of Mirkwood and
# Dol Guldur Orcs cards discarded for the pool, and unlocks The King's Quest, which the app cannot deal yet, so the path stops there and its node reads Coming soon (src/campaign/scenarios/lost-in-mirkwood/golden.test.ts pins the path).
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: lostmirk-won
      SCENARIO_ID: lost-in-mirkwood
      CHOICE_ID: "line"
      CHOICE_PROMPT: "Melanwar or the log"
      CHOICE_CONSEQUENCE: ".*guidance on traversing Wilderland.*"
      NO_XP: "true"
# The win wrote the guidance line and the pool's encounter cards to the Campaign Log (the path reads them under the Pool line). Only the guidance line is part 2's own: the pool and treasure asserts below also match what Journey Up
# the Anduin's win wrote (A Growing Threat), so they prove part 2 wrote something only once the fixture `lostmirk-won` exists and the run shows them after the win, not before.
- assertVisible:
    id: path-ally-lines
    text: ".*guidance on traversing Wilderland.*"
- assertVisible:
    id: path-pool-encounter
    text: ".*A Growing Threat.*"
- assertVisible:
    id: path-treasures
- assertVisible:
    id: node-the-kings-quest-status
    text: "Coming soon"
- assertVisible:
    id: path-soon
    text: "The King's Quest is coming soon."
- assertNotVisible:
    id: begin
