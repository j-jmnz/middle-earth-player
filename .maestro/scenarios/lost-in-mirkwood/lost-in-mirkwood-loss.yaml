appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 53. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `lostmirk-lost` (scripts/e2e/lost-in-mirkwood.ts): a real two-handed game of
# Lost in Mirkwood (the Defenders of Gondor and Swords of the Noldor lists, Easy) dealt from the log Journey Up the Anduin's win writes, parked on its loss. A loss has no reward screen and writes nothing: the scenario
# stays current, and neither the guidance line nor a pool card of the Spiders of Mirkwood or Dol Guldur Orcs sets reaches the log. The steps are the shared subflow's (.maestro/subflows/scenario-loss.yaml).
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: lostmirk-lost
      SCENARIO_ID: lost-in-mirkwood
# Back on the path, this part wrote none of its Ered Mithrin columns: no guidance line (Journey Up the Anduin's cards are still there).
- tapOn:
    id: log-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertNotVisible:
    id: path-ally-lines
    text: ".*guidance on traversing Wilderland.*"
- assertVisible:
    id: node-lost-in-mirkwood-status
    text: "Next"
