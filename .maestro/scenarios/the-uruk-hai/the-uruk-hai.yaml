appId: com.middleearth.player
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `hai-won` (scripts/e2e/the-uruk-hai.ts): a real two-handed game of The Uruk-hai (The One Deck and the Defenders of Gondor lists, Easy), parked on its win (Rescue the Captives defeated with Uglúk defeated, the Captives rescued). The fixture is OPEN: scripts/e2e/fixtures.ts found no win of The One Deck and the Defenders of Gondor lists in its seeds (docs/phases/STATUS.md), so the flow cannot run until one is found.
# The Resolution (143071:B:1) asks nothing when the pursuit value is above 25; at 25 or lower the first player chooses between a Skill boon for each player and Beyond All Hope, which is offered only while the list of
# fallen heroes holds a hero (a fresh log holds none), so the one option is the Skill boons. The campaign has no XP. The win unlocks Helm's Deep, which the app deals: its node reads Next and the path offers Begin.
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: hai-won
      SCENARIO_ID: the-uruk-hai
      NO_XP: "true"
# The win unlocks Helm's Deep, whose node reads Next and the path offers Begin (the part is playable, so no line says it is coming soon).
- assertVisible:
    id: node-helms-deep-status
    text: "Next"
- assertVisible:
    id: begin
- assertNotVisible:
    id: path-soon
