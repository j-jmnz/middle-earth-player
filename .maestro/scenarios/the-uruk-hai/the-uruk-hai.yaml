appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `hai-won` (scripts/e2e/the-uruk-hai.ts): a real two-handed game of The Uruk-hai
# (the Defenders of Gondor and Swords of the Noldor lists, Easy) from the blank log a new The Two Towers playthrough starts on, parked on its win (Uglúk out of play, Rescue the Captives defeated). The fixture is OPEN:
# scripts/e2e/fixtures.ts found no win of the two decklists in its seeds (Aragorn, who has 5 hit points and whose leaving play loses the game, leaves play in most games), so this flow cannot run until a seed wins.
# This flow waits for `hai-won`: its Resolution choices (CHOICE_ID, CHOICE_PROMPT, CHOICE_CONSEQUENCE of the subflow) are written once the fixture's seed is known, because the boon the screen offers first depends on the pursuit value the win
# ends on and the Traits of its heroes (`resolution-choice-<option>`). Until then the subflow asserts the win and the road only.
# The table shows the pursuit value as a dial of the top bar (`pursuit-value`, docs/design-system-table.md, Top bar), read while the victory is on it. The Resolution's choice: with the pursuit
# value at 25 or lower the players choose between a Skill boon for each player and Beyond All Hope, and a boon is offered only on a hero with its Trait (143071:B:1). The Two Towers has no XP.
# The win unlocks Helm's Deep, which is not playable yet: its node is coming soon (scripts/checks/maestro.test.ts, path-soon).
- runFlow:
    file: ../../subflows/scenario-win.yaml
    env:
      FIXTURE: hai-won
      SCENARIO_ID: the-uruk-hai
      NO_XP: "true"
      TABLE_WIDGET: pursuit-value
# Helm's Deep is the next part and the app cannot deal it yet: the road says so and offers nothing to begin.
- assertVisible:
    id: path-soon
    text: "Helm.s Deep is coming soon\\."
- assertNotVisible:
    id: begin
