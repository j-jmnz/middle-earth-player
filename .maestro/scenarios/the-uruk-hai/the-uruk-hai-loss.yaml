appId: com.middleearth.lcg
tags:
  - scenario
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `hai-lost` (scripts/e2e/the-uruk-hai.ts): a real two-handed game of The Uruk-hai
# (the Defenders of Gondor and Swords of the Noldor lists, Easy) from the blank log a new The Two Towers playthrough starts on, parked on its loss. A loss has no reward screen and writes nothing: the scenario stays
# current and no card reaches the pool. The path screen has no table-menu: the log is opened from `log-open`.
- runFlow:
    file: ../../subflows/scenario-loss.yaml
    env:
      FIXTURE: hai-lost
      SCENARIO_ID: the-uruk-hai
