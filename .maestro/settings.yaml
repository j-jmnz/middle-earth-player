appId: com.middleearth.lcg
---
# Settings and UI scale (user request, 2026-10-28). Written in a cloud session: it has not run. The Settings tab applies a change at
# once and keeps it in user.db, so Large is still chosen after the app is closed and opened again. The flow ends by restoring defaults.
- launchApp:
    clearState: true
- tapOn:
    id: settings-tab
- assertVisible:
    id: app-settings
- assertVisible:
    id: app-settings-scale-medium
    selected: true
- tapOn:
    id: app-settings-scale-large
- assertVisible:
    id: app-settings-scale-large
    selected: true
# Closing the app and opening it again keeps the choice (no clearState: the settings row stays).
- stopApp
- launchApp
- tapOn:
    id: settings-tab
- assertVisible:
    id: app-settings
- assertVisible:
    id: app-settings-scale-large
    selected: true
# Restore defaults asks twice, in place, and puts Medium back.
- scrollUntilVisible:
    element:
      id: app-settings-restore
- tapOn:
    id: app-settings-restore
- tapOn:
    id: app-settings-restore-confirm
- scrollUntilVisible:
    element:
      id: app-settings-scale-medium
    direction: UP
- assertVisible:
    id: app-settings-scale-medium
    selected: true
