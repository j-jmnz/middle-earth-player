appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 42. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `raid-won` (scripts/e2e/raid-on-the-grey-havens.ts): a real two-handed
# game of Raid on the Grey Havens, parked on its win (Captain Sahír is in the victory display and no location in play has damage). The fixture is OPEN: no win of the two starter decklists was found in
# 200 seeds, so `raid-won` is not committed and this flow cannot run until scripts/e2e/fixtures.ts writes one (docs/phases/STATUS.md). Confirming the win writes the XP from the campaign card (1 for each
# surviving player, the cards under The Havens Burn, the Elven Wave-runners, Na'asiyah, no enemies in play, threat 40 or less) and, with parts 1 and 2 won in the log, unlocks Flight of the Stormcaller
# (src/campaign/golden-raid.test.ts pins the path). The fixture's log has parts 1 and 2 recorded as won (the logs the Voyage and Fate goldens' wins write), so the path opens on Raid and resumes it; the
# Raid node reads Won.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/raid-won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
- assertNotVisible:
    id: life
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
# Graxar in the victory display would ask for Parrying Cutlass or Throwing Axe first; the fixture's game does not reach him.
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-raid-on-the-grey-havens-status
    text: "Won.*"
# The XP the Resolution gave is written: the line reads it and there is XP to spend.
- assertVisible:
    id: xp-line
- assertVisible:
    id: xp-open
