appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 30. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture
# `anduin-lost` is a real two-handed game of Journey Along the Anduin, from the log Passage Through Mirkwood's won game writes, parked on its
# loss: Mendor left play (01130:A:5). A loss has no reward screen and writes nothing, so Journey Along the Anduin stays current and Escape from
# Dol Guldur stays locked. The path screen has no table-menu: the log is opened from `log-open`.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/anduin-lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
# The Lost Resolution names why: the reason the reducer recorded (01130:A:5), above the consequence line.
- assertVisible:
    id: resolution-reason
    text: "Mendor left play\\."
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The log is unchanged: Passage Through Mirkwood completed, Journey Along the Anduin still current, Escape from Dol Guldur locked, no prisoner.
- assertVisible:
    id: node-passage-through-mirkwood-status
    text: "Won.*"
- assertVisible:
    id: node-journey-along-the-anduin-status
    text: "Next"
- assertVisible:
    id: node-escape-from-dol-guldur-status
    text: "Locked"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertNotVisible:
    id: log-prisoner
- assertVisible:
    id: log-scenario-journey-along-the-anduin
    text: ".*Not completed.*"
