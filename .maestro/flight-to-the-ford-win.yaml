appId: com.middleearth.lcg
tags:
  - scenario
---
# OPEN (2026-10-26): its fixture `ford-won` is not committed (see flight-to-the-ford.yaml): it is a game of Flight to the Ford
# parked on its win, dealt from the log of two scenarios no win has been found for.
# Phase 13. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json).
# 141056's Resolution asks nothing: the burden cards in play, in the encounter deck and in the discard pile are added to the
# campaign pool, the ones still in the burden deck are not (src/rules/resolution.ts, EarnAllBurdens). Confirming writes them
# and unlocks The Ring Goes South.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/ford-won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
# No choice is asked: the screen says what confirming records and what it unlocks.
- assertVisible:
    id: resolution-consequence
    text: "Confirming records .* in the campaign and unlocks The Ring Goes South\\."
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-flight-to-the-ford-status
    text: "Completed"
- assertVisible:
    id: node-the-ring-goes-south-status
    text: "Current"
# Kill and relaunch: the burdens are on the log and The Ring Goes South is unlocked.
- stopApp
- launchApp
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-the-ring-goes-south-status
    text: "Current"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertNotVisible:
    id: log-burdens
    text: "None"
- assertVisible:
    id: log-scenario-flight-to-the-ford
    text: ".*rounds.*"
