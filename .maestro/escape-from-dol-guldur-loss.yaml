appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 31. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture
# `dol-guldur-lost` is a real two-handed game of Escape from Dol Guldur (the Dwarves of Durin and Elves of Lórien lists), from Passage Through Mirkwood's log with
# Journey Along the Anduin completed by hand, parked on its loss: no seat remains. A loss has no reward screen and writes nothing, so Escape from
# Dol Guldur stays current and The Oath stays locked. The path screen has no table-menu: the log is opened from `log-open`.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/dol-guldur-lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
# The Lost Resolution names why: the reason the reducer recorded above the consequence line.
- assertVisible:
    id: resolution-reason
    text: "No seats remain\\."
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The log is unchanged: Journey Along the Anduin completed, Escape from Dol Guldur still current, The Oath locked, nothing carried over.
- assertVisible:
    id: node-journey-along-the-anduin-status
    text: "Completed"
- assertVisible:
    id: node-escape-from-dol-guldur-status
    text: "Current"
- assertVisible:
    id: node-the-oath-status
    text: "Locked"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertNotVisible:
    id: log-carry-over
- assertVisible:
    id: log-scenario-escape-from-dol-guldur
    text: ".*Not completed.*"
