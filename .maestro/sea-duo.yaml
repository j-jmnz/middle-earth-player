appId: com.middleearth.lcg
tags:
  - scenario
---
# Phases 39b and 40. Written in a cloud session: it has not run. Needs the e2e-test build and the fixture `sea-duo` (scripts/e2e-voyage.ts, written by scripts/e2e-fixtures.ts): a real two-handed
# game of Voyage Across Belegaer, Player 1 with the Dream-chaser, parked on the first planning window.
# A peek at the seat without the Dream-chaser keeps the Heading dial; a tap on the dial opens the Heading card's preview.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/sea-duo"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: path-back
- tapOn:
    id: continue
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: heading
# Peek at the seat that has no Dream-chaser: the dial is the game's, so it stays.
- tapOn:
    id: threat-1
- extendedWaitUntil:
    visible:
      id: peek-text
    timeout: 5000
- assertVisible:
    id: heading
- tapOn:
    id: peek-back
- extendedWaitUntil:
    notVisible:
      id: peek-text
    timeout: 5000
# A tap on the dial shows the Heading card large; it does not change the dial.
- tapOn:
    id: heading
- extendedWaitUntil:
    visible:
      id: card-preview
    timeout: 5000
- assertVisible:
    id: card-preview-name
    text: "Heading · .*"
- tapOn:
    id: card-preview-scrim
- extendedWaitUntil:
    notVisible:
      id: card-preview
    timeout: 5000
- assertVisible:
    id: heading
