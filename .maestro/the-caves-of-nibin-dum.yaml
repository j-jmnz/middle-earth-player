appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 33. Written in a cloud session: it has not run, and it cannot until the fixture exists: `nibin-dum-won` is open (the auto-player found no win of the two decklists in 120 seeds,
# docs/phases/STATUS.md). Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture `nibin-dum-won` is to be a real
# two-handed game of The Caves of Nibin-Dûm (the Defenders of Gondor and Swords of the Noldor lists) from the log a real `oath-won` writes when it is confirmed (The Dark of Mirkwood,
# part 2 of 2), parked on its win. 41051's Resolution asks nothing: with the highest final threat under 40 each player earns a Ranger Sense and a Ranger Sense for each player is
# kept for the next campaign. Confirming completes the campaign: there is no next scenario and the path has nothing to begin. The same win in Mirkwood Paths (part 5, from The Oath's log in
# that campaign) completes that campaign the same way: that is checked in Node (src/campaign/nibin-campaign.test.ts) and stays open on the phone until a real `dol-guldur-won` fixture
# exists (docs/phases/STATUS.md). The path screen has no table-menu: the log is opened from `log-open`.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/nibin-dum-won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
# The campaign card has only a Setup and a Resolution: no tokens on the top bar.
- assertNotVisible:
    id: campaign-tokens
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
- assertVisible:
    id: resolution-consequence
    text: "Confirming records .*Ranger Sense.* and completes The Dark of Mirkwood\\. A Ranger Sense for each player is kept for your next campaign\\."
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-the-oath-status
    text: "Won.*"
- assertVisible:
    id: node-the-caves-of-nibin-dum-status
    text: "Won.*"
- assertVisible: ".*2 of 2 completed.*"
- assertNotVisible:
    id: begin
# Every scenario is won: the bar says so and names what waits for the next campaign (the Ranger Sense kept by 41051's Resolution).
- assertVisible:
    id: path-complete
    text: "Campaign complete\\."
- assertVisible:
    id: path-carry
    text: ".*Ranger Sense.* for your next campaign\\."
- assertVisible:
    id: path-new-campaign
# Kill and relaunch: the campaign is complete on the log, with the Ranger Sense in the pool and the carry-over written.
- stopApp
- launchApp
# A finished playthrough is not on the Campaigns hub: History lists it under Finished, and its card opens the path.
- assertNotVisible:
    id: continue-next
- tapOn:
    id: history-open
- assertVisible:
    id: library-finished
- tapOn:
    id: entry-save-e2e-nibin-dum-won
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible: ".*2 of 2 completed.*"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertVisible:
    id: log-scenario-the-caves-of-nibin-dum
    text: ".*rounds.*"
- assertVisible:
    id: log-boons
    text: ".*Ranger Sense.*"
- assertVisible:
    id: log-carry-over
    text: ".*Ranger Sense.*"
