appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 30. Written in a cloud session: it has not run, and its fixture is OPEN: no win of the two decklists was found by the auto-player (300 seeds, Easy,
# `scripts/e2e-anduin.ts`; the lists lose when Mendor or the heroes fall), so `anduin-won` is not committed and the e2e route does not offer it. Once a win is found
# (`scripts/e2e-fixtures.ts` writes it), this flow runs as written. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture `anduin-won` is
# a real two-handed game of Journey Along the Anduin (the Dwarves of Durin and Elves of Lórien lists, Easy), from the log Passage Through
# Mirkwood's won game writes, parked on its win: stage 3B, no enemy in play (01128:B:3). 01130's Resolution asks nothing: each Valor and Scarred
# attached to a hero goes to the pool on that hero and the hero with the most damage is the prisoner. Confirming writes the log and unlocks
# Escape from Dol Guldur. The path screen has no table-menu: the log is opened from `log-open`. Mirkwood Paths is not a saga: no life tracker,
# no burden deck on this table.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/anduin-won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
# The sentence names the prisoner (the hero with the most damage), and what is attached to which hero; no choice is asked.
- assertVisible:
    id: resolution-consequence
    text: "Confirming records .* and unlocks Escape from Dol Guldur\\. .*, the hero with the most damage, is taken prisoner\\."
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-journey-along-the-anduin-status
    text: "Completed"
- assertVisible:
    id: node-escape-from-dol-guldur-status
    text: "Current"
# Kill and relaunch: the scenario is on the log, the prisoner is recorded and Escape from Dol Guldur is unlocked.
- stopApp
- launchApp
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-escape-from-dol-guldur-status
    text: "Current"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertVisible:
    id: log-scenario-journey-along-the-anduin
    text: ".*rounds.*"
- assertVisible:
    id: log-prisoner
- assertVisible:
    id: log-boons
    text: ".*Valor.*"
