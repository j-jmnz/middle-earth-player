appId: com.middleearth.lcg
---
# Phase 10. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json).
- launchApp:
    clearState: true
- tapOn:
    id: start-fellowship
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: briefing
    timeout: 15000
- assertVisible:
    id: briefing-stages
- assertVisible:
    id: deal
    enabled: false
# The starter deck brings no Ring-bearer. The slot is required, and the sentence names the card and the rule.
- extendedWaitUntil:
    visible:
      id: deck-pick-0-stealth-and-steadfastness
    timeout: 15000
- tapOn:
    id: deck-pick-0-stealth-and-steadfastness
- assertVisible:
    id: ringbearer-slot
- assertVisible:
    id: briefing-error-0
- assertVisible: ".*Ring-bearer.*"
- assertVisible:
    id: deal
    enabled: false
# Filling the slot makes the loadout legal.
- tapOn:
    id: ringbearer-141001
- assertNotVisible:
    id: briefing-error-0
- assertVisible:
    id: briefing-checklist
- assertVisible:
    id: deal
    enabled: true
- tapOn:
    id: deal
- extendedWaitUntil:
    visible:
      id: table
    timeout: 15000
