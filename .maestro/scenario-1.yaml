appId: com.middleearth.lcg
---
# OPEN (2026-10-25): its fixture is not committed. No legal win of the two starter decks has been found on this engine, so
# the e2e route opens nothing for it (docs/phases/STATUS.md). Run scripts/e2e-fixtures.ts --won when one is found.
# Phase 11. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json), which
# opens the fixture route. The fixture is a real two-handed game of both starter decks parked on the first Resolution
# choice (src/campaign/fixtures). Maestro reads text and testIDs; it does not address card pictures or judge a drag.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The open scenario resumes on the table: the phase rail names the moment.
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- assertVisible:
    id: rail
# Only Flight to the Ford declares a life tracker and a burden deck (flight-to-the-ford.yaml asserts both there).
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
# A burden, then a boon, each confirmed before the next is asked.
- assertVisible: "Choose a burden"
- tapOn:
    id: resolution-choice-141078
- assertVisible:
    id: resolution-consequence
    text: ".*Gandalf's Delay.*"
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible: "Choose a boon"
    timeout: 15000
- tapOn:
    id: resolution-choice-141077
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: resolution-consequence
      text: ".*A Knife in the Dark.*"
    timeout: 15000
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# Kill and relaunch: the choices are on the log and A Knife in the Dark is unlocked.
- stopApp
- launchApp
# The last playthrough opens on the list's Continue panel; Path opens its path.
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-a-knife-in-the-dark-status
    text: "Current"
- tapOn:
    id: table-menu
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertVisible:
    id: log-burdens
    text: ".*Gandalf's Delay.*"
- assertVisible:
    id: log-boons
    text: ".*Gildor Inglorion.*"
