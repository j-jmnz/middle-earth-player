appId: com.middleearth.lcg
tags:
  - scenario
---
# OPEN (2026-10-26): its fixture `south-stage-4` is not committed. It is dealt from the log scenarios 1 to 3 write when they are won,
# and no win of scenario 1 or 2 has been found with the starter decks (docs/phases/STATUS.md; see flight-to-the-ford.yaml). Run
# scripts/e2e-fixtures.ts --won when one is found, then add `south-start`, `south-stage-4`, `south-won` and `south-lost` to
# src/campaign/fixtures.ts.
# Phase 14. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json), which
# opens the fixture route. The fixture is a real game of The Ring Goes South parked on stage 4B: Doors of Durin is the active
# location, a second active location has been traveled to, and the Ring-bearer is facedown under the Watcher in the Water
# (mec109.stage-4). The table names both active locations and the card holding the Ring-bearer; the engine wrote what they say.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/south-stage-4"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-flight-to-the-ford-status
    text: "Completed"
- assertVisible:
    id: node-the-ring-goes-south-status
    text: "Current"
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The Ring-bearer is facedown: a Ring mark on the holder's threat dial, and the dial says where (phase 22 removed the "Active:"
# and Ring-bearer lines; the active locations are drawn on the table).
- assertVisible:
    id: threat-0-ring
- assertVisible:
    text: ".*The Ring-bearer is facedown under Watcher in the Water.*"
# No life number and no burden deck on this table.
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
# Kill and relaunch: the replayed game shows the same table.
- stopApp
- launchApp
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- assertVisible:
    id: threat-0-ring
