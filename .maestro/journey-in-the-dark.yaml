appId: com.middleearth.lcg
tags:
  - scenario
---
# OPEN (2026-10-30): its fixture `moria-won` is not committed. It is a real game of Journey in the Dark with The Balrog in play, parked on its win, dealt
# from the log of four scenarios no win has been found for (docs/phases/STATUS.md; see the-ring-goes-south.yaml). Run scripts/e2e/fixtures.ts --won
# when a chain of wins is found, then add `moria-won`, `moria-pairs` and `moria-lost` to src/campaign/fixtures.ts.
# Phase 15. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json), which opens the fixture route.
# 142039's Resolution reads the final state: with The Balrog still in play (it is in the staging area, Doom, Doom, Doom spent) all four burdens are earned
# with no choice to make. Confirming writes the log and unlocks Breaking of the Fellowship. No life number, no burden deck; the damage tokens on Doom,
# Doom, Doom and the resource tokens on stage 2 are drawn on their cards, and the stage's tokens are on the top bar (142041:B:3).
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/moria-won"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-the-ring-goes-south-status
    text: "Won.*"
- assertVisible:
    id: node-journey-in-the-dark-status
    text: "Next"
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
- assertNotVisible:
    id: life
- assertNotVisible:
    id: burden-deck
- assertVisible:
    id: rail-current
    text: "Victory"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 30000
# The Balrog is in play: nothing to choose, all four burdens are recorded.
- assertNotVisible: "Choose a burden"
- assertVisible:
    id: resolution-consequence
    text: "Confirming records .*Pursued by the Enemy.*Shadow of Fear.*Grievous Wound.*Overcome by Grief.* in the campaign and unlocks Breaking of the Fellowship\\."
- tapOn:
    id: resolution-confirm
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-journey-in-the-dark-status
    text: "Won.*"
- assertVisible:
    id: node-breaking-of-the-fellowship-status
    text: "Next"
# Kill and relaunch: the scenario is on the log with the four burdens and Breaking of the Fellowship is unlocked.
- stopApp
- launchApp
- tapOn:
    id: continue-path
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- assertVisible:
    id: node-breaking-of-the-fellowship-status
    text: "Next"
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertVisible:
    id: log-scenario-journey-in-the-dark
    text: ".*rounds.*"
