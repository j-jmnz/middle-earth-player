appId: com.middleearth.lcg
tags:
  - scenario
---
# Phases 19, 20, 21 and 23 (the Log is a reading panel, `log-sheet`). Written in a cloud session: it has not run (no phone, simulator or Maestro there). Needs the e2e-test build
# (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture is the solo game of Stealth and Steadfastness parked on its loss
# (src/campaign/fixtures). The top bar holds the dials, the rail and the menu button; Back, Log, Rules, Booklet and Table
# settings are rows of the menu. A tap on the rail opens the phase carousel (phase 20).
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
# The bar shows the dials, the rail and the menu button, and none of the controls that moved.
- assertVisible:
    id: threat-0
- assertVisible:
    id: rail
- assertVisible:
    id: table-menu
- assertNotVisible:
    id: log-open
- assertNotVisible:
    id: table-back
# A tap on the rail opens the panel of the round's phases, on the current one (the fixture is parked on its loss in the Combat phase, round 4); a
# tap outside closes it and sends nothing. The rail draws the phase and its ticks; the step stays in the tree under its id, as clear text.
- assertVisible:
    id: rail-current
- assertVisible:
    id: rail-phase
    text: "Combat"
- tapOn:
    id: rail
- assertVisible:
    id: carousel-phase-combat
- tapOn:
    id: carousel-scrim
    point: "50%,90%"
- assertNotVisible:
    id: carousel-phase-combat
# The menu has its five rows.
- tapOn:
    id: table-menu
- assertVisible:
    id: table-back
    text: ".*Leave the table.*"
- assertVisible:
    id: log-open
- assertVisible:
    id: rules-open
- assertVisible:
    id: booklet-open
- assertVisible:
    id: settings-open
# A tap outside closes it and sends nothing.
- tapOn:
    id: table-menu-scrim
    point: "50%,90%"
- assertNotVisible:
    id: log-open
# A row closes the menu and then acts: the Log opens and closes.
- tapOn:
    id: table-menu
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log-sheet
    timeout: 15000
- assertNotVisible:
    id: log-open
- tapOn:
    id: log-close
- assertNotVisible:
    id: log-sheet
# Table settings opens its panel, with the Animation speed row (Normal and Quick).
- tapOn:
    id: table-menu
- tapOn:
    id: settings-open
- extendedWaitUntil:
    visible:
      id: settings-speed
    timeout: 15000
- assertVisible:
    id: settings-speed-normal
- assertVisible:
    id: settings-speed-quick
- tapOn:
    id: settings-close
- assertNotVisible:
    id: settings-speed
# Leave the table: the game is saved and the path is under it.
- tapOn:
    id: table-menu
- tapOn:
    id: table-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
