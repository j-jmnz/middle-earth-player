appId: com.middleearth.lcg
tags:
  - showcase
---
# The README showcase's rules reference (docs/plans/readme-showcase.md, Shot list), on the iPhone and the iPad. scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "rules"
      READY: rules
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: rules
