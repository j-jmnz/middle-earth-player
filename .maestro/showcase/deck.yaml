appId: com.middleearth.lcg
tags:
  - showcase
---
# The README showcase's deck builder on the Stealth and Steadfastness starter deck (docs/plans/readme-showcase.md, Shot list), on the iPhone and the iPad. scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "deck/stealth-and-steadfastness"
      READY: deck-name
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: deck
