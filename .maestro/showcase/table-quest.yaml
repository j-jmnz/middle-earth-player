appId: com.middleearth.lcg
tags:
  - showcase
---
# The README showcase's quest GIF: A Shadow of the Past's round-3 quest, the characters committed (the fixture's `showcase.commit`) and the encounter cards revealed into staging (past-showcase-quest) (docs/showcase.md, Shot list), on the iPhone and the iPad, landscape. scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-table.yaml
    env:
      FIXTURE: past-showcase-quest
- startRecording: "${typeof DEVICE !== 'undefined' ? DEVICE : 'device'}-${typeof THEME !== 'undefined' ? THEME : 'dark'}-table-quest"
- runFlow:
    when:
      notVisible:
        id: sheet-list
    commands:
      - tapOn:
          id: dock-more-actions
- tapOn:
    id: sheet-list
- tapOn:
    id: sheet-option-i35
- tapOn:
    id: sheet-option-i36
- tapOn:
    id: sheet-option-i34
- tapOn:
    id: sheet-option-i54
- tapOn:
    id: sheet-option-i56
- tapOn:
    id: sheet-option-i43
- tapOn:
    id: sheet-primary
- waitForAnimationToEnd:
    timeout: 15000
- stopRecording
