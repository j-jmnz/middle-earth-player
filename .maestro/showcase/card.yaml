appId: com.middleearth.player
tags:
  - showcase
---
# The README showcase's card screen of Aragorn (Revised Core Set), on the iPhone (portrait) and the iPad (landscape). scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "card/01001"
      READY: card-text
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: card
