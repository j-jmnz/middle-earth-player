appId: com.middleearth.lcg
tags:
  - showcase
---
# The README showcase's card screen of Aragorn (Revised Core Set) (docs/plans/readme-showcase.md, Shot list), on the iPhone and the iPad. scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "card/01001"
      READY: card-text
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: card
