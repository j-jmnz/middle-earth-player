appId: com.middleearth.player
tags:
  - showcase
---
# The README showcase's campaign path of The Fellowship of the Ring, A Shadow of the Past on the table (docs/showcase.md, Shot list), on the iPhone (portrait) and the iPad (landscape). scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "e2e/past-showcase-board"
      READY: campaign-path
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: path
