appId: com.middleearth.lcg
tags:
  - showcase
---
# The README showcase's Settings, with the Theme choice (docs/showcase.md, Shot list), on the iPhone (portrait) and the iPad (landscape). scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "settings"
      READY: app-settings
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: settings
