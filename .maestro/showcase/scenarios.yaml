appId: com.middleearth.lcg
tags:
  - showcase
---
# The README showcase's Scenarios tab, each scenario with its scene (docs/showcase.md, Shot list), on the iPhone (portrait) and the iPad (landscape). scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "scenarios"
      READY: scenarios
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: scenarios
