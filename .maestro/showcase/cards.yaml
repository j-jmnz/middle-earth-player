appId: com.middleearth.lcg
tags:
  - showcase
---
# The README showcase's card pool, the Cards tab (docs/showcase.md, Shot list), on the iPhone (portrait) and the iPad (landscape). scripts/showcase/capture.ts runs it with THEME and DEVICE.
- runFlow:
    file: ../subflows/showcase-start.yaml
    env:
      LINK: "cards"
      READY: pool-search
- runFlow:
    file: ../subflows/showcase-shot.yaml
    env:
      SHOT: cards
