appId: com.middleearth.lcg
---
# Phase 10. Written in a cloud session: it has not run. Asserts the empty state and the close control by testID; it needs
# no PDF (a smoke file, if a later flow wants one, is a one-page PDF written for the test, not a page of MEC109).
- launchApp:
    clearState: true
- assertVisible:
    id: campaign-list
# The books are on the Rules tab.
- tapOn:
    id: rules-tab
- tapOn:
    id: booklet-open
- extendedWaitUntil:
    visible:
      id: booklet-empty
    timeout: 15000
- assertVisible:
    id: booklet-name
- assertVisible:
    id: booklet-add
- assertVisible:
    id: booklet-close
# Close returns to the screen that opened the reader.
- tapOn:
    id: booklet-close
- assertVisible:
    id: rules
# The same reader opens the other book, and from a scenario's screens.
- tapOn:
    id: booklet-open-learn-to-play
- assertVisible:
    id: booklet-empty
- tapOn:
    id: booklet-close
- tapOn:
    id: campaigns-tab
- tapOn:
    id: start-fellowship
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: booklet-open
- assertVisible:
    id: booklet-empty
- tapOn:
    id: booklet-close
- assertVisible:
    id: campaign-path
