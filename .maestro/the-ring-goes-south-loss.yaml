appId: com.middleearth.lcg
tags:
  - scenario
---
# OPEN (2026-10-26): its fixture `south-lost` is not committed (see the-ring-goes-south.yaml): it is a game of The Ring Goes South
# parked on its loss, dealt from the log of three scenarios no win has been found for.
# Phase 14. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture is
# a real game parked on a loss (Doors of Durin held 9 damage, 142030:A:3). A loss has no reward screen and writes nothing.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/south-lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The log is unchanged: The Ring Goes South still current, Journey in the Dark locked.
- assertVisible:
    id: node-the-ring-goes-south-status
    text: "Current"
- assertVisible:
    id: node-journey-in-the-dark-status
    text: "Locked"
