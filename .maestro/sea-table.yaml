appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 39b. Written in a cloud session: it has not run (no phone, simulator or Maestro there). Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and the fixture `sea-solo`
# (scripts/e2e-fixtures.ts): a real dealt game of Voyage Across Belegaer, true solo, the Dream-chaser and one other ship, parked on the first Sailing test's commit. No Dream-chaser
# scenario deals before phase 40, so the fixture and the run move to phase 40's phone half (docs/phases/phase-39b-ships-on-the-table.md, E2E).
# The engine shifts the heading when it performs the test, after the commit, so the dial reads Sun at the commit and shows the off-course badge once the look is up.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/sea-solo"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: path-back
- tapOn:
    id: continue
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: quest-advance-progress
    optional: true
# The Heading dial is in the top bar, on-course until the test runs; its word is clear text.
- assertVisible:
    id: heading
- assertVisible:
    id: heading-value
    text: "Sun"
# The commit is a pick on the play area: the dock's List holds the characters that can be committed, the Dream-chaser among them.
- tapOn:
    id: sheet-list
- tapOn:
    id: "sheet-option-.*"
    index: 0
# The readout counts the cards the picks look at, the Dream-chaser as 2.
- assertVisible:
    id: readout-result
    text: ".*Looks at .* cards?.*"
- tapOn:
    id: sheet-primary
# The test has shifted the heading off-course and looked at the cards: each is a read-only row, with its symbols.
- extendedWaitUntil:
    visible:
      id: heading-delta
      text: "Off-course"
    timeout: 5000
- assertVisible:
    id: heading-value
    text: "Cloud"
- tapOn:
    id: sheet-list
- assertVisible:
    id: "sheet-look-.*"
- assertVisible:
    id: readout-result
    text: ".* to .*"
# Answer the moment: shift on-course for the symbol found. The dial pops and its badge says so.
- tapOn:
    id: sheet-primary
- extendedWaitUntil:
    visible:
      id: heading-delta
      text: "On-course"
    timeout: 5000
- assertVisible:
    id: heading-value
    text: "Sun"
