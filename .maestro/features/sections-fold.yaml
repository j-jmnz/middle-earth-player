appId: com.middleearth.player
---
# Phase 28b. Written in a cloud session: it has not run. A folded section stays folded after a relaunch, on each tab. Needs the e2e-test build for the fixture save.
- launchApp:
    clearState: true
# Campaigns: a fresh install has no playthrough, so the e2e-test build's fixture (EXPO_PUBLIC_E2E_SEED=1) writes one first.
- openLink: "middleearthplayer://e2e/lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: path-back
# The current playthrough is the page's hero and does not fold; Coming later does.
- scrollUntilVisible:
    element:
      id: section-coming
    direction: DOWN
- assertVisible:
    id: section-coming-body
- tapOn:
    id: section-coming
- assertNotVisible:
    id: section-coming-body
- launchApp
- scrollUntilVisible:
    element:
      id: section-coming
    direction: DOWN
- assertNotVisible:
    id: section-coming-body
# Open it again, so the next run starts the same.
- tapOn:
    id: section-coming
- assertVisible:
    id: section-coming-body
# Scenarios: fold a box and relaunch.
- tapOn:
    id: scenarios-tab
- assertVisible:
    id: section-box-fellowship-of-the-ring-body
- tapOn:
    id: section-box-fellowship-of-the-ring
- assertNotVisible:
    id: section-box-fellowship-of-the-ring-body
- launchApp
- tapOn:
    id: scenarios-tab
- assertVisible:
    id: section-box-fellowship-of-the-ring
- assertNotVisible:
    id: section-box-fellowship-of-the-ring-body
- tapOn:
    id: section-box-fellowship-of-the-ring
- assertVisible:
    id: section-box-fellowship-of-the-ring-body
