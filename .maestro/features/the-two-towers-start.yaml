appId: com.middleearth.player
---
# Phase 62. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and a catalog in which `the-two-towers`
# is marked playable (its first scenario in PLAYABLE_SCENARIOS; until then the campaign tile is locked and `locked-the-two-towers` is the one thing to see).
# Starts The Two Towers from a fresh phone: no finished Fellowship playthrough, so no "Continue the saga" section, and an empty log. The first scenario,
# The Uruk-hai, grants the first player Aragorn, so the briefing asks for no Ring-bearer slot. The log's Two Towers rows appear only once they hold
# something (the Marshes choices, the enemies under The Black Gate).
- launchApp:
    clearState: true
- assertVisible:
    id: campaign-list
- tapOn:
    id: new-the-two-towers
- assertVisible:
    id: campaign-setup
- assertNotVisible:
    id: continue-saga
- assertNotVisible:
    id: mode-the-two-towers-none
- assertVisible:
    id: start-the-two-towers
- tapOn:
    id: start-the-two-towers
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: log-open
- assertVisible:
    id: log
- assertVisible:
    id: log-threat
- assertNotVisible:
    id: log-marshes
- assertNotVisible:
    id: log-black-gate
- tapOn:
    id: log-back
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: briefing
    timeout: 15000
# Scenarios 7 to 9 grant Aragorn: no Ring-bearer slot.
- assertNotVisible:
    id: ringbearer-slot
