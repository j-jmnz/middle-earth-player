appId: com.middleearth.lcg
---
# Phase 62. Written in a cloud session: it has not run. Needs no PDF (like booklet.yaml): the reader opens empty with the book's name.
# The Two Towers campaign rulebook (MEC112) is the seventh book on the Rules tab, and the one the Two Towers campaign opens.
- launchApp:
    clearState: true
- tapOn:
    id: rules-tab
- assertVisible:
    id: rules
- scrollUntilVisible:
    element:
      id: booklet-open-the-two-towers
- tapOn:
    id: booklet-open-the-two-towers
- extendedWaitUntil:
    visible:
      id: booklet-empty
    timeout: 15000
- assertVisible:
    id: booklet-name
- assertVisible: "The Two Towers campaign rulebook"
- tapOn:
    id: booklet-close
- assertVisible:
    id: rules
