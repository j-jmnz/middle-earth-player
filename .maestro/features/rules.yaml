appId: com.middleearth.lcg
---
# Written in a cloud session: it has not run. The dock's Rules tab finds a rule by name and opens it.
- launchApp
- assertVisible:
    id: campaign-list
- assertVisible:
    id: cards-tab
- tapOn:
    id: rules-tab
- assertVisible:
    id: booklet-open
- tapOn:
    id: rules-search
- inputText: "surge"
- tapOn:
    id: rule-rr.surge
- assertVisible:
    id: rule-text
- assertVisible: "Surge"
- tapOn:
    id: rule-back
- assertVisible:
    id: rules
# A rule from the campaign book opens the reader on its page, and Close comes back to the rule.
- tapOn:
    id: rules-search
- eraseText
- inputText: "hide tests"
- tapOn:
    id: rule-mec109.hide-tests
- tapOn:
    id: rule-open-book
- extendedWaitUntil:
    visible:
      id: booklet-close
    timeout: 15000
- tapOn:
    id: booklet-close
- assertVisible:
    id: rule-open-book
