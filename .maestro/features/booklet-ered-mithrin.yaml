appId: com.middleearth.lcg
---
# Phase 50. Written in a cloud session: it has not run. Needs no PDF (like booklet.yaml): the reader opens empty with the book's name.
# The Ered Mithrin campaign rulebook (MEC115) is the sixth book on the Rules tab, and the one the Ered Mithrin campaign opens.
- launchApp:
    clearState: true
- tapOn:
    id: rules-tab
- assertVisible:
    id: rules
- scrollUntilVisible:
    element:
      id: booklet-open-ered-mithrin
- tapOn:
    id: booklet-open-ered-mithrin
- extendedWaitUntil:
    visible:
      id: booklet-empty
    timeout: 15000
- assertVisible:
    id: booklet-name
- assertVisible: "Ered Mithrin campaign rulebook"
- tapOn:
    id: booklet-close
- assertVisible:
    id: rules
