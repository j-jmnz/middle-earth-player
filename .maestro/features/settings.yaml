appId: com.middleearth.player
---
# Settings and UI scale (user request, 2026-10-28). Written in a cloud session: it has not run. Settings (the gear) applies a change at
# once and keeps it in user.db, so Large is still chosen after the app is closed and opened again. The accessibility settings (Extra large, Strong
# outlines, Title face, Animation speed, Banner closes, Table as a list, Confirm time) are each set and show as chosen. The flow ends by restoring defaults.
- launchApp:
    clearState: true
- tapOn:
    id: settings-open
- assertVisible:
    id: app-settings
- assertVisible:
    id: app-settings-scale-medium
    selected: true
- tapOn:
    id: app-settings-scale-large
- assertVisible:
    id: app-settings-scale-large
    selected: true
# Closing the app and opening it again keeps the choice (no clearState: the settings row stays).
- stopApp
- launchApp
- tapOn:
    id: settings-open
- assertVisible:
    id: app-settings
- assertVisible:
    id: app-settings-scale-large
    selected: true
# Extra large is the largest size; the other rows each move off their default and show the choice.
- scrollUntilVisible:
    element:
      id: app-settings-scale-xlarge
    direction: UP
- tapOn:
    id: app-settings-scale-xlarge
- assertVisible:
    id: app-settings-scale-xlarge
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-contrast-always
- assertVisible:
    id: app-settings-contrast-system
    selected: true
- tapOn:
    id: app-settings-contrast-always
- assertVisible:
    id: app-settings-contrast-always
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-title-face-plain
- assertVisible:
    id: app-settings-title-face-carved
    selected: true
- tapOn:
    id: app-settings-title-face-plain
- assertVisible:
    id: app-settings-title-face-plain
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-speed-slow
- assertVisible:
    id: app-settings-speed-normal
    selected: true
- tapOn:
    id: app-settings-speed-slow
- assertVisible:
    id: app-settings-speed-slow
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-banner-closes-tap
- assertVisible:
    id: app-settings-banner-closes-timer
    selected: true
- tapOn:
    id: app-settings-banner-closes-tap
- assertVisible:
    id: app-settings-banner-closes-tap
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-table-list-always
- assertVisible:
    id: app-settings-table-list-system
    selected: true
- tapOn:
    id: app-settings-table-list-always
- assertVisible:
    id: app-settings-table-list-always
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-confirm-time-none
- assertVisible:
    id: app-settings-confirm-time-standard
    selected: true
- tapOn:
    id: app-settings-confirm-time-none
- assertVisible:
    id: app-settings-confirm-time-none
    selected: true
# Restore defaults asks twice, in place, and puts Medium back.
- scrollUntilVisible:
    element:
      id: app-settings-restore
- tapOn:
    id: app-settings-restore
- tapOn:
    id: app-settings-restore-confirm
- scrollUntilVisible:
    element:
      id: app-settings-scale-medium
    direction: UP
- assertVisible:
    id: app-settings-scale-medium
    selected: true
# Every accessibility setting is back on its default.
- scrollUntilVisible:
    element:
      id: app-settings-contrast-system
- assertVisible:
    id: app-settings-contrast-system
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-title-face-carved
- assertVisible:
    id: app-settings-title-face-carved
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-speed-normal
- assertVisible:
    id: app-settings-speed-normal
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-banner-closes-timer
- assertVisible:
    id: app-settings-banner-closes-timer
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-table-list-system
- assertVisible:
    id: app-settings-table-list-system
    selected: true
- scrollUntilVisible:
    element:
      id: app-settings-confirm-time-standard
- assertVisible:
    id: app-settings-confirm-time-standard
    selected: true
