appId: com.middleearth.player
tags:
  - scenario
  - reader
---
# Screen reader plan, section 5. Written in a cloud session: it has not run (no phone, simulator or Maestro there). Maestro cannot turn VoiceOver or TalkBack
# on, so the table is opened with the reader table forced: a development build started with EXPO_PUBLIC_E2E_SEED=1 EXPO_PUBLIC_FORCE_READER=1
# (src/ui/screen-reader.ts, useReaderMode; README.md, Maestro). A release build such as the e2e-test profile ignores the variable and draws the
# canvas, so the `reader` tag keeps this flow out of the run that every flow gets (config.yaml, excludeTags); `maestro test --include-tags=reader .maestro`
# runs it on a development build, and its first step fails on a table that is not the reader table.
# The fixture is the real two-handed game of A Shadow of the Past parked on the first player's planning window of round 1 (src/campaign/fixtures, `duo`).
# The reader table lists zones as headings (`reader-zone-<zone>`), cards as buttons by their place in the zone (`reader-card-<zone>-<n>`) and piles by name
# (`reader-pile-<pile>`). One round's first half is played from it: both seats pass their planning, then the first hero is picked on the reader table
# and committed to the quest from the dock.
- launchApp:
    clearState: true
- openLink: "middleearthplayer://e2e/duo"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: path-back
- assertVisible:
    id: continue-next
    text: "On the table: A Shadow of the Past"
- tapOn:
    id: continue
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch).
- tapOn:
    id: quest-advance-progress
    optional: true
- extendedWaitUntil:
    visible:
      id: dock
    timeout: 15000
- assertVisible:
    id: reader-table
# The zones are headings, the hero and the hand are buttons, the piles are listed last.
- assertVisible:
    id: reader-zone-play
- assertVisible:
    id: reader-zone-hand
- assertVisible:
    id: reader-zone-staging
- assertVisible:
    id: reader-zone-engaged
- assertVisible:
    id: reader-zone-piles
- assertVisible:
    id: reader-card-play-0
- assertVisible:
    id: reader-pile-deck
# Planning: each seat passes (the first tap arms the dock's button, the second sends), until the quest commit opens (its List button is there).
- repeat:
    while:
      notVisible:
        id: sheet-list
    commands:
      - tapOn:
          id: table-pass
      - tapOn:
          id: table-pass
    times: 4
- extendedWaitUntil:
    visible:
      id: sheet-list
    timeout: 10000
# The first hero on the reader table is picked for the commit; the dock says how many and commits them.
- assertNotVisible:
    id: table-commit
- tapOn:
    id: reader-card-play-0
- assertVisible:
    id: table-commit
- tapOn:
    id: table-commit
- extendedWaitUntil:
    notVisible:
      id: table-commit
    timeout: 10000
# The table is still the reader table, one moment on.
- assertVisible:
    id: reader-table
