appId: com.middleearth.player
---
# Phase 38. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and a catalog in which
# `dream-chaser` is marked playable (the first Dream-chaser scenario in PLAYABLE_SCENARIOS, phase 40; its briefing also needs the sea
# family's ship cards, phase 39). Starts Dream-chaser, which is not a saga: no Ring-bearer slot. The Hard/Expert Mode card is offered at
# the campaign setup and again in the briefing; the path shows the XP line. The flow goes on into the table and the Campaign Setup choices (the second ship, the
# Modification boon, the damage trade). The order of those choices and their rows are the engine's (src/rules/families/sea/fleet.ts, sea/campaign.ts); not run.
- launchApp:
    clearState: true
- assertVisible:
    id: campaign-list
- tapOn:
    id: new-dream-chaser
- assertVisible:
    id: campaign-setup
- assertVisible:
    id: mode-dream-chaser-none
- tapOn:
    id: mode-dream-chaser-hard
- assertVisible:
    id: mode-dream-chaser-note
- assertVisible:
    id: start-dream-chaser
- tapOn:
    id: start-dream-chaser
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# Nothing is earned yet: the XP line reads zero and there is no XP to spend.
- assertVisible:
    id: xp-line
- assertNotVisible:
    id: xp-open
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: briefing
    timeout: 15000
# The briefing starts on the card the setup chose, and offers the other two.
- assertVisible:
    id: mode-hard
- assertVisible:
    id: mode-expert
- tapOn:
    id: mode-expert
- assertVisible:
    id: mode-note
# No Ring-bearer slot, and no sentence asking for one.
- assertNotVisible:
    id: ringbearer-slot
- assertNotVisible:
    id: briefing-error-0
# The deck is picked and dealt: the table opens on the Campaign Setup. A lone player takes the Dream-chaser and one other ship; the tray's List holds the choices.
- tapOn:
    id: deck-pick-0-defenders-of-gondor
- assertVisible:
    id: deal
    enabled: true
- tapOn:
    id: deal
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
- tapOn:
    id: sheet-list
- tapOn:
    id: "sheet-option-.*"
    index: 0
- tapOn:
    id: sheet-primary
# Each ship is fitted with a Modification boon: a row for each boon set aside, by the card's name.
- tapOn:
    id: sheet-list
- assertVisible:
    id: "sheet-option-.*"
    index: 0
- assertVisible: "Armor Plating"
- tapOn:
    id: "sheet-option-.*"
    index: 0
- tapOn:
    id: sheet-primary
# Then each ship may trade 2 damage for 1 resource: trade or keep, a row each.
- tapOn:
    id: sheet-list
- assertVisible:
    id: sheet-option-trade
- assertVisible:
    id: sheet-option-keep
