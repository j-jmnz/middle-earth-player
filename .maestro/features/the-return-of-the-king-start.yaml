appId: com.middleearth.lcg
---
# Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and a catalog in which `the-return-of-the-king`
# is marked playable (its first scenario in PLAYABLE_SCENARIOS; until then the campaign tile is locked and `locked-the-return-of-the-king` is the one thing to see).
# Starts The Return of the King from a fresh phone: no finished Two Towers playthrough, so no "Continue the saga" section, and an empty log. The first scenario,
# The Passing of the Grey Company, grants the first player Aragorn, so the briefing asks for no Ring-bearer slot. The log's notes rows (the resources on The Corsair
# Fleet, the tokens on The Black Gate, how the saga ended) appear only once they hold something.
- launchApp:
    clearState: true
- assertVisible:
    id: campaign-list
- tapOn:
    id: new-the-return-of-the-king
- assertVisible:
    id: campaign-setup
- assertNotVisible:
    id: continue-saga
- assertVisible:
    id: start-the-return-of-the-king
- tapOn:
    id: start-the-return-of-the-king
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: log-open
- assertVisible:
    id: log
- assertVisible:
    id: log-threat
- assertNotVisible:
    id: log-black-gate
- assertNotVisible:
    id: log-corsair-fleet
- assertNotVisible:
    id: log-black-gate-tokens
- assertNotVisible:
    id: log-campaign-end
- tapOn:
    id: log-back
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: briefing
    timeout: 15000
# Scenarios 1 to 3 and 5 grant Aragorn: no Ring-bearer slot.
- assertNotVisible:
    id: ringbearer-slot
