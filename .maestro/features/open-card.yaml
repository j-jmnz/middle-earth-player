appId: com.middleearth.player
---
- launchApp
- tapOn:
    id: cards-tab
- tapOn:
    id: collection-open
- scrollUntilVisible:
    element:
      id: collection-the-lord-of-the-rings
    direction: DOWN
    timeout: 40000
    speed: 70
    visibilityPercentage: 100
- tapOn:
    id: collection-the-lord-of-the-rings
- tapOn:
    id: pack-TBR
- tapOn:
    id: card-141001
- assertVisible: "141001"
- stopApp
- launchApp
- tapOn:
    id: cards-tab
- tapOn:
    id: collection-open
- scrollUntilVisible:
    element:
      id: collection-the-lord-of-the-rings
    direction: DOWN
    timeout: 40000
    speed: 70
    visibilityPercentage: 100
- tapOn:
    id: collection-the-lord-of-the-rings
- tapOn:
    id: pack-TBR
- tapOn:
    id: card-141001
- assertVisible: "141001"
