appId: com.middleearth.lcg
---
# Phase 50. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json) and a catalog in which
# `ered-mithrin` is marked playable (the first Ered Mithrin scenario in PLAYABLE_SCENARIOS, phase 52; until then the campaign tile is locked and
# `locked-ered-mithrin` is the one thing to see). Starts Ered Mithrin, which is not a saga and has no XP and no Hard/Expert Mode card: no Ring-bearer
# slot, no mode picker, no XP line. The path and the log carry the Ered Mithrin columns (emce.campaign-log): treasures, the allies' lines, Beldis's boxes
# and the encounter cards of the Campaign Pool, all empty at the start.
- launchApp:
    clearState: true
- assertVisible:
    id: campaign-list
- tapOn:
    id: new-ered-mithrin
- assertVisible:
    id: campaign-setup
# No Hard/Expert Mode card for this campaign.
- assertNotVisible:
    id: mode-ered-mithrin-none
- assertVisible:
    id: start-ered-mithrin
- tapOn:
    id: start-ered-mithrin
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# Nothing is earned yet, and there is no XP to spend.
- assertNotVisible:
    id: xp-line
- assertNotVisible:
    id: xp-open
# The path shows a group of the Ered Mithrin log only once it holds something; the log keeps every row.
- assertNotVisible:
    id: wilderland-line
- assertNotVisible:
    id: path-treasures
- assertNotVisible:
    id: path-ally-lines
- assertNotVisible:
    id: path-beldis
- assertNotVisible:
    id: path-pool-encounter
- tapOn:
    id: log-open
- assertVisible:
    id: log
- assertVisible:
    id: log-treasures
- assertVisible:
    id: log-ally-lines
- assertVisible:
    id: log-beldis
- assertVisible:
    id: log-pool-encounter
- assertNotVisible:
    id: log-xp
- tapOn:
    id: log-back
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: briefing
    timeout: 15000
# No Hard/Expert Mode card, no Ring-bearer slot.
- assertNotVisible:
    id: mode-hard
- assertNotVisible:
    id: ringbearer-slot
- assertNotVisible:
    id: briefing-error-0
