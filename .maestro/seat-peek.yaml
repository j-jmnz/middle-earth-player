appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 26. Written in a cloud session: it has not run (no phone, simulator or Maestro there). Needs the e2e-test build
# (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture is a real two-handed game of A Shadow of the Past parked on the first player's
# planning window of round 1 (src/campaign/fixtures, `duo`): two dials, Player 1 acting. A tap on the dial of the seat that is not
# shown peeks at that seat; the banner says whose area it is and who acts, and Back to Player 1 ends it.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/duo"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# Two dials; no peek yet.
- assertVisible:
    id: threat-0
- assertVisible:
    id: threat-1
- assertNotVisible:
    id: peek-banner
# The second seat's dial peeks: the banner says whose area this is and who is acting, the dial wears the viewing mark and the
# way back is on the banner.
- tapOn:
    id: threat-1
- extendedWaitUntil:
    visible:
      id: peek-banner
    timeout: 5000
- assertVisible:
    id: peek-text
    text: "Viewing Player 2 · Player 1 is acting"
- assertVisible:
    id: peek-back
- assertVisible:
    id: threat-1-viewing
- assertVisible:
    id: threat-1-eye
# The dock is still Player 1's: its eyebrow starts with the seat.
- assertVisible:
    id: dock
# Back to Player 1 ends the peek.
- tapOn:
    id: peek-back
- assertNotVisible:
    id: peek-banner
- assertNotVisible:
    id: threat-1-viewing
# The acting seat's dial is also the way back, and the same dial peeks again.
- tapOn:
    id: threat-1
- extendedWaitUntil:
    visible:
      id: peek-banner
    timeout: 5000
- tapOn:
    id: threat-0
- assertNotVisible:
    id: peek-banner
