appId: com.middleearth.lcg
---
# The loss of a scenario, played from a save fixture: open the fixture, begin, read the defeat on the table, open the Resolution (a loss has no reward
# screen and writes nothing), go back, and read the scenario as not completed in the log. A scenario flow runs it with `runFlow` and keeps its own
# extra assertions after the call (`.maestro/scenarios/<scenario-id>/`). This folder is outside the `flows` globs of `.maestro/config.yaml`, so
# `maestro test .maestro` does not run it on its own.
# Env: FIXTURE (the fixture name, src/campaign/fixtures/registry.ts), SCENARIO_ID (the scenario's id, data/scenarios).
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/${FIXTURE}"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
- assertNotVisible:
    id: life
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
- assertVisible:
    id: resolution-reason
    text: ".+"
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The log is unchanged: no XP was earned for this part and it is not completed.
- tapOn:
    id: log-open
- extendedWaitUntil:
    visible:
      id: log
    timeout: 15000
- assertVisible:
    id: log-scenario-${SCENARIO_ID}
    text: ".*Not completed.*"
