appId: com.middleearth.lcg
---
# The README showcase's start (docs/showcase.md, Capture flows): a fresh app, its Theme set to the one the capture asks for, then
# the link the shot opens. The showcase build (EXPO_PUBLIC_SHOWCASE=1, EXPO_PUBLIC_E2E_SEED=1) is the only one that runs it.
# Env: LINK (the path after middleearthlcg://, a fixture as e2e/<name>), READY (the testID that says the opened screen has settled).
# Optional env: THEME (dark or light) and DEVICE (iphone or ipad), given by scripts/showcase/capture.ts with -e; dark and an iPhone when they are not.
# The iPad lies landscape for every shot; the iPhone stays portrait, and the table turns itself landscape (shots.ts, orientationOf).
- launchApp:
    clearState: true
- runFlow:
    when:
      true: "${typeof DEVICE !== 'undefined' && DEVICE === 'ipad'}"
    commands:
      - setOrientation: LANDSCAPE_LEFT
- runFlow:
    when:
      true: "${typeof DEVICE === 'undefined' || DEVICE !== 'ipad'}"
    commands:
      - setOrientation: PORTRAIT
# iOS asks "Open in “Middle Earth LCG”?" when a link is sent to the simulator, and while the alert is up Maestro sees nothing of the app. Links
# an earlier run sent and nobody answered wait in a queue, each alert showing as the one before it goes: they are all canceled here (opening one
# would leave the Campaigns screen for that run's link), until none comes back for 2 s. The shot's own link is opened below.
- extendedWaitUntil:
    visible: "Open in .*Middle Earth LCG.*"
    timeout: 3000
    optional: true
- repeat:
    while:
      visible: "Open in .*Middle Earth LCG.*"
    times: 30
    commands:
      - tapOn: "^Cancel$"
      - extendedWaitUntil:
          visible: "Open in .*Middle Earth LCG.*"
          timeout: 2000
          optional: true
# A link sent while the app is still opening its databases is dropped, so the flow waits for the app to be running (the Campaigns screen's
# Settings gear, a button whose id iOS always shows Maestro) and reaches Settings through it, as features/settings.yaml does; the shot's own
# link is sent once the app is running.
- extendedWaitUntil:
    visible:
      id: settings-open
    timeout: 90000
- tapOn:
    id: settings-open
- extendedWaitUntil:
    visible:
      id: app-settings
    timeout: 30000
- tapOn:
    id: "${'app-settings-theme-' + (typeof THEME !== 'undefined' ? THEME : 'dark')}"
- openLink: "middleearthlcg://${LINK}"
- extendedWaitUntil:
    visible: "Open in .*Middle Earth LCG.*"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Open in .*Middle Earth LCG.*"
    commands:
      - tapOn: "^Open$"
- extendedWaitUntil:
    visible:
      id: "${READY}"
    timeout: 30000
