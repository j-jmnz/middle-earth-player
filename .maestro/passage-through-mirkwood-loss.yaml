appId: com.middleearth.lcg
tags:
  - scenario
---
# Phase 29. Written in a cloud session: it has not run. Needs the e2e-test build (EXPO_PUBLIC_E2E_SEED=1, eas.json). The fixture
# `mirkwood-lost` is a real two-handed game parked on its loss: Mendor left play (01129:A:3). A loss has no reward screen and writes
# nothing, so Passage Through Mirkwood stays current and Journey Along the Anduin stays locked.
- launchApp:
    clearState: true
- openLink: "middleearthlcg://e2e/mirkwood-lost"
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
- tapOn:
    id: begin
- extendedWaitUntil:
    visible:
      id: table
    timeout: 30000
# The table opens on the quest stage in play (quest-advance.ts, openingLatch); a game that is over opens on the table.
- tapOn:
    id: quest-advance-progress
    optional: true
- assertVisible:
    id: rail-current
    text: "Defeat"
- tapOn:
    id: sheet-outcome
- extendedWaitUntil:
    visible:
      id: resolution
    timeout: 15000
- assertVisible:
    id: resolution-outcome
    text: "Defeat"
# The Lost Resolution names why: the reason the reducer recorded (01129:A:3), above the consequence line.
- assertVisible:
    id: resolution-reason
    text: "Mendor left play\\."
- assertVisible: "The scenario was lost. Nothing is written to the log."
- assertNotVisible:
    id: resolution-confirm
- tapOn:
    id: resolution-back
- extendedWaitUntil:
    visible:
      id: campaign-path
    timeout: 15000
# The log is unchanged: Passage Through Mirkwood still current, Journey Along the Anduin locked.
- assertVisible:
    id: node-passage-through-mirkwood-status
    text: "Next"
- assertVisible:
    id: node-journey-along-the-anduin-status
    text: "Locked"
